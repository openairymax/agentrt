name: Commit Audit

# 0.1.21 L-11 / L-12：提交纪律与测试债的常驻判定。
#
# 规则与本地 commit-msg 钩子同源（tools/scripts/git/commit-rules.sh），
# 本作业只负责取工具、定范围、跑门禁；「谁算违例」不在 YAML 里重写，
# 否则钩子与 CI 各有一套，迟早一边先松。
#
# 只判 AIRY_COMMIT_BASE..HEAD 的新增提交：历史不改写（§2.3 第 4 条），
# 旧提交的问题登记在 COMMIT-AUDIT.md，由 L-10 普查出账。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for range)
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Resolve audit base
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in
            ''|0000000000000000000000000000000000000000) base="" ;;
          esac
          echo "AIRY_COMMIT_BASE=$base" >> "$GITHUB_ENV"

      - name: Fetch tools (gate scripts + rule SSoT)
        run: |
          git clone -q --depth 1 https://github.com/openairymax/tools.git \
            "$RUNNER_TEMP/airy-tools"

      - name: Audit new commits (R1~R9)
        env:
          AIRY_COMMIT_REPO: ${{ github.workspace }}
        run: bash "$RUNNER_TEMP/airy-tools/scripts/ci/quality/gates/g47-commit-audit.sh"

      # R6 反查要读基线侧各子模块 gitlink 指向的头文件：gitlink 是独立仓，
      # 主仓检出不含其内容，未初始化时基线不可读、新增符号无法判定（以环境
      # 错误 exit 2 判红）。初始化按 agentrt 树钉定的 SHA 检出叶子子仓，
      # atoms 为 private，需 GH_TOKEN。
      - name: Init submodules (baseline reads)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh

      # 基线侧 gitlink 可能已不在子仓默认分支的可达历史里：子仓谱系重写后
      # 旧 pin 成为悬挂对象，全量克隆同样取不到，R6 便以「基线不可读」判红
      # （run 46087726819 实证：gateway@775ea17 在远端存在却不在克隆内）。
      # 按 SHA 定向取回基线 pin，使审计能读到基线头文件；取不到即红。
      - name: Fetch baseline submodule pins
        if: env.AIRY_COMMIT_BASE != ''
        run: |
          set -euo pipefail
          git ls-tree -r "$AIRY_COMMIT_BASE" | while read -r meta path; do
            set -- $meta
            [ "$1" = "160000" ] || continue
            sha="$3"
            git -C "$path" cat-file -e "$sha^{commit}" 2>/dev/null && continue
            echo "fetch base pin: $path@${sha:0:12}"
            git -C "$path" fetch -q --depth 1 origin "$sha"
          done

      - name: Test debt (R6) and ledger
        env:
          G48_REPO: ${{ github.workspace }}
        run: bash "$RUNNER_TEMP/airy-tools/scripts/ci/quality/gates/g48-test-debt.sh"
