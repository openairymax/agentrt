name: Mirror Release Artifacts

# M13 配套回填通道：把 atomgit（SSoT）既有 Release 的附件集镜像到
# GitHub/Gitee Releases，并支持以 notes 入参统一纠偏三端 Release 正文。
# 三类场景：
#   1. 历史版本回填（v0.1.7 ~ rc9 之前各版）：发布时镜像机制尚未存在；
#   2. 镜像修复重跑：publish-mirror.sh 幂等（同名同大小跳过），安全重放；
#   3. 发布说明修订/纠偏：notes 入参一次性对齐 GH/Gitee（publish-mirror.sh
#      的 RELEASE_NOTES）与 atomgit（AIRY_NOTES_ONLY=1 只改正文）。
#
# 制品来源（优先级）：
#   a) release.yml 对应 run 的 release-dist 工件（90 天保留期内首选）；
#   b) 工件缺失时 FETCH_MISSING=1 从 atomgit release 回填（大件走慢通道，
#      仅建议补 manifest/sig/asc 小件场景）。
#
# 前提（fail-closed 在脚本内校验）：目标 tag 已由 sync-mirror 同步到
# GitHub/Gitee——tag 纪律：tag 仅在真正创建发行版时打（atomgit 单向同步）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '待回填版本（如 v0.1.13-rc9，须已有 atomgit Release + 三端 tag）'
        required: true
        type: string
      fetch_missing:
        description: 'dist 缺件时从 atomgit release 回填（历史版本/工件过期场景必开）'
        required: false
        type: boolean
        default: true
      notes:
        description: '发布说明（可选；传入则作为三端 Release 正文：GH/Gitee 覆盖 dist/notes.txt，atomgit 幂等对齐）'
        required: false
        type: string
      # U-3 方案 A（2026-09-09）：release.yml 的 publish-mirror 段完成 GH 快
      # 通道后 dispatch 本 workflow 异步补齐 Gitee，release_run_id 精确定位
      # 同一 run 的 publish-dist（canonical 规范签名集），避免回填竞态。
      release_run_id:
        description: 'release.yml run id（可选）：精确下载该 run 的 publish-dist 工件'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  mirror:
    name: Mirror ${{ inputs.version }} to GitHub + Gitee + atomgit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GT_TOKEN }}
    steps:
      - name: Checkout (workflow only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init submodules (tools)
        run: bash .github/scripts/init-submodules.sh tools

      - name: Download release-dist artifact
        # tag 触发的 release run 其 head_branch 即 tag 名；找不到（工件过期/
        # 无该 run）时置空继续，由 FETCH_MISSING 全量回填兜底。
        # U-3 方案 A：优先按 release_run_id 下载 publish-dist（canonical
        # 签名集）；未提供时回退按 tag 查成功 run 下载（release-dist）。
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.release_run_id }}"
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID="$(gh run list -R openairymax/agentrt --workflow=release.yml \
              --branch "${VERSION}" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId' || true)"
          fi
          if [ -n "${RUN_ID:-}" ]; then
            echo "release run: ${RUN_ID}"
            if gh run download "${RUN_ID}" -R openairymax/agentrt \
                -n "agentrt-${VERSION}-publish-dist" -D dist 2>/dev/null; then
              echo "publish-dist 已下载（canonical 签名集）"
            else
              gh run download "${RUN_ID}" -R openairymax/agentrt \
                -n "agentrt-${VERSION}-release-dist" -D dist \
                || echo "::warning::release-dist 工件下载失败（过期？），将全量回填"
            fi
          else
            echo "::warning::未找到 ${VERSION} 的 release run，将全量回填"
          fi
          mkdir -p dist
          ls -la dist/ || true

      - name: Mirror to GitHub + Gitee
        env:
          # 缺件回填开关透传（publish-mirror.sh 读 FETCH_MISSING=1）
          FETCH_MISSING: ${{ inputs.fetch_missing && '1' || '0' }}
          # 发布说明覆盖（publish-mirror.sh 读 RELEASE_NOTES，优先于
          # dist/notes.txt）：回填历史版本时可传入社区面向说明
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          bash _tools/scripts/ci/release/publish-mirror.sh "${VERSION}" dist

      - name: Align atomgit (SSoT) release body
        # 三端正文一致性收口：atomgit 是 SSoT，正文对齐由 publish-release.sh
        # 的幂等 PATCH 承担（AIRY_NOTES_ONLY=1 只改正文，不签名/不上传）。
        # notes 为空时跳过——绝不能以空正文覆盖 SSoT（发布说明按版本维护）。
        if: ${{ inputs.notes != '' }}
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPO: openairymax/agentrt
          AIRY_NOTES_ONLY: '1'
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "${ATOMGIT_TOKEN:-}" ]; then
            echo "::warning::未配置 ATOMGIT_TOKEN，跳过 atomgit 正文对齐"
            exit 0
          fi
          bash _tools/scripts/ci/release/publish-release.sh "${VERSION}" dist
