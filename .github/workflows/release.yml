name: Release
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release v{0}', github.event.inputs.version) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.5)'
        required: true
        type: string

# R26/R29：三段式编排。构建矩阵（release-build.yml）→ 打包签名
# （release-package.yml）→ 发布（release-publish.yml），每段单文件
# 作业数 ≤5。本文件不含构建/签名/发布逻辑，只表达段间依赖与权限上限。
#
# R27 凭据最小权限盘点（全仓 release 三段合计 secrets.GH_TOKEN）：
#   1) init-submodules（各构建腿 / release / e2e / finalize / publish-atomgit）
#      —— 跨仓只读检出 agent-workload、tools、products；GITHUB_TOKEN 仅
#      本仓可见，闭源子仓会 404，故必须用 App token，且只用于只读检出。
#   2) check-submodule-pins —— 跨仓 gitlink 可达性查询（同上，只读）。
#   3) publish-atomgit 的 GITHUB_PAT —— 向 GitHub main 补推 manifest 快照
#      （contents: write，单仓单分支写入）。
#   4) publish-mirror —— 同仓 Releases 上传 + 同仓 workflow dispatch，
#      已改用 secrets.GITHUB_TOKEN（R27 最小权限，不再借用 PAT）。
#   5) publish-npm —— 仅 NPM_TOKEN（发布 npm 薄壳，与 GitHub 无关）。
permissions:
  contents: write
  actions: write

# 同 tag 并发单飞：重跑同 tag 时自动取消旧 run（不同 tag 互不阻塞）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发布正文契约前置：正文结构只在装配段校验（release-package.yml 的
  # Generate release notes），失败点排在九平台构建之后。契约违规要等
  # 矩阵跑完才暴露（tag run 45238559586 已为坏正文启动全矩阵，
  # Quality Gates 45239752727 判红即该违规）。本作业只读检出，复用同一个
  # check-release-notes.sh（判定实现单点，不复制规则），秒级失败。
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Assert release notes contract
        run: bash .github/scripts/check-release-notes.sh "RELEASE_NOTES.d/${VERSION}.md"

  build:
    needs: [preflight]
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read

  package:
    needs: [build]
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: [package]
    uses: ./.github/workflows/release-publish.yml
    secrets: inherit
    permissions:
      contents: write
      actions: write
