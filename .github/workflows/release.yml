name: Release
# run 列表直接显示版本号，与 env.VERSION 同一表达式口径。
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release v{0}', github.event.inputs.version) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.5)'
        required: true
        type: string

permissions:
  contents: write

# 同 tag 并发单飞：重跑同 tag 时自动取消旧 run（不同 tag 互不阻塞）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 版本号 SSoT：tag 推送 → github.ref_name；workflow_dispatch →
# inputs.version 合成 v 前缀。全流程统一引用 env.VERSION。
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version) }}

jobs:
  # 门禁绿前置（0.1.20 快照同源的另一半）：被发行的 commit 必须是门禁
  # Build & Test 与 Quality Gates 实际跑过并判绿的 commit。发行平面原先对
  # 目标 commit 从未经过门禁即聚合发行物——上游一推进，「门禁验证的树」与
  # 「发行装配的树」即分叉，且事后无从证明二进制对应哪一判据。tag 常紧随
  # main push 打出，故按 sha 轮询等待门禁终态，而不要求维护者人工择时；
  # 判红、被取消、或该 commit 根本没有 push 运行（非 push tip、被
  # paths-ignore 跳过的纯文档 commit）一律 fail-closed，不设跳过通道——
  # 跳过会让「绿」与被发行内容脱钩，正是本判据要消除的形态。门禁清单在
  # 脚本内单点声明，严禁在此复制。
  ci-green:
    runs-on: ubuntu-latest
    # 门禁最坏 150min/作业 + 队列余量；超时即红，不无限占用 runner
    timeout-minutes: 260
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Assert gate workflows green at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/assert-ci-green.sh "$GITHUB_SHA"

  # Linux x86-64：container ubuntu:20.04 保证 glibc 2.31 基线（覆盖
  # Ubuntu 20.04+/Debian 11+/Pi OS Bullseye+）。平台命名规范：
  # OS-架构族-位宽（linux-x86-64 / linux-arm-64 …），下同；旧两代平台名由
  # manifest 别名覆盖（见 publish-release.sh ALIAS）。GitHub Actions
  # 容器作业仅支持 Linux runner，macOS/Windows 必须拆分为独立作业。
  build-linux-x86-64:
    runs-on: ubuntu-latest
    env:
      # 预构建工具链镜像（build-toolchain-images.yml 构建，digest 钉版）：
      # host 只做检出/打包，项目构建全在镜像容器内完成，依赖已固化进镜像。
      # Dockerfile / lib-builddeps.sh 变更后需重建镜像并 bump 此处引用
      # （禁浮动 tag）。
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 定向子模块检出（agent-workload 构建源 + tools 脚本）：不用
      # submodules:true —— 全量递归会拉 agent-linux/kernel（~2.5GB，构建
      # 用不到），且闭源子模块在 GitHub 不存在会使 checkout 整体失败。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 容器内完成 Configure→Build→Install→TUI→finalize 全链。
      # BUILD_DIR 在容器内覆盖为 /tmp/airy-build（构建目录必须在源码树外；
      # host 侧 BUILD_DIR 仅保持变量形态，实际不使用）。
      # 完全体 finalize 在容器内执行：host 无 /usr/local 自编译库，host 侧
      # ldd 收集必 not found（.collected 不入包）。
      - name: Build in x86-64 container
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:amd64-20260906-1@sha256:99d3ac35030b3a19ef36277b443e011005224ee53b6187e8a60ca40b429def82
          platform: linux/amd64
          leg: x86-64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（SSoT：build-tui.sh 收敛 header 注入 + cargo 缺失兜底；
            # x86-64 为门禁产品腿，TUI 属 REQUIRED_SUBTREE，fail-hard）
            AIRY_TUI_FAIL_HARD=1 bash /src/.github/scripts/build-tui.sh agent-workload/sdk/tui "$STAGE_DIR/bin"
            # Python 运行时依赖（完全体包 lib/，fail-closed：子树缺失即腿失败，
            # 发布预检仅作兜底）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：包内建 agentrt-<version> 顶层目录（install.sh 二进制模式按
      # agentrt-* 目录名匹配解压位置），platform 标记 + sha256 + upload
      # 由 lf-package 统一模板收敛（staging 由 cmake --install 创建，必存在，
      # 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-64
          artifact-suffix: linux-x86-64

  # macOS arm-64：原生 runner（无 container——容器作业仅支持 Linux）。
  # openssl/zlib/sqlite/curl 为 keg-only，需显式导出 pkg-config 路径。
  build-macos-arm-64:
    # mac 原生腿跨 workflow 共享 ci-macos-runner-bus（与 build-test
    # macos-build 同组），串行不抢占（cancel=false 公平等待）。
    concurrency:
      group: ci-macos-runner-bus
      cancel-in-progress: false
    runs-on: macos-latest
    env:
      # 构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          # brew openssl 为 keg-only：libwebsockets.h 直接 #include <openssl/ssl.h>
          # 不经 pkg-config 的 TU 需要显式 -I/-L（CFLAGS/LDFLAGS 是
          # CMAKE_C_FLAGS / CMAKE_EXE_LINKER_FLAGS 的环境初值，全 target 生效）
          # arm64 Homebrew 头文件在 $(brew --prefix)/include，clang 不自动搜索，
          # 一并 -I。
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          # Apple Silicon 默认不搜 /opt/homebrew/lib：gateway_d 链接
          # -lmicrohttpd 等裸库名需 -L$(brew --prefix)/lib。
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          # TUI 构建收敛共享脚本（airymax header 注入 + cargo + 部署，见
          # .github/scripts/build-tui.sh；macOS 为门禁产品腿，fail-hard）
          AIRY_TUI_FAIL_HARD=1 bash .github/scripts/build-tui.sh agent-workload/sdk/tui "${{ env.STAGE_DIR }}/bin"
          # Python 运行时依赖（完全体包 lib/，fail-closed）
          bash .github/scripts/copy-python-runtime.sh "${{ env.STAGE_DIR }}" \
            || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }

      # macOS dylib 自包含：otool -L 递归收集非系统 dylib 入 lib/，
      # install_name_tool 重写为 @executable_path/../lib/，ad-hoc 重签，
      # fail-closed 校验（干净机无 brew 依赖亦可启动 daemon 群）。
      - name: Bundle macOS runtime dylibs (self-contained)
        run: bash _tools/scripts/ci/release/bundle-macos-dylibs.sh "${{ env.STAGE_DIR }}"

      # 干净机"可启"冒烟：逐个启动 bin/ Mach-O，要求无 dyld 加载失败
      # （非系统依赖全部自包含）。托管 runner 为一次性干净 VM。
      - name: Smoke-run packaged daemons (clean-machine proxy)
        run: bash _tools/scripts/ci/release/smoke-macos-runtime.sh "${{ env.STAGE_DIR }}"

      # 打包：lf-package 统一模板（macOS 原生腿无 bootstrap 部署——
      # bin/agentrt-bootstrap.sh 为 Linux daemon 编排脚本）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-64
          artifact-suffix: macos-arm-64
          with-bootstrap: 'false'

  # macOS x86-64 (Intel)：macos-15-intel 原生 runner（Intel 存量社区用户
  # 需 x86-64 包）。打包步骤与 arm-64 同构，仅 platform 标记与制品名不同。
  # Intel runner 的 brew prefix 为 /usr/local，Configure 步骤一律
  # $(brew --prefix) 动态解析，无需区分 prefix。
  build-macos-x86-64:
    # macos-15-intel 与 macos-latest 分属不同物理 runner 池，用独立并发组
    #（仅同一 run 内自洽）；arm/latest 队列见 build-macos-arm-64。
    concurrency:
      group: ci-macos-intel-runner-bus
      cancel-in-progress: false
    runs-on: macos-15-intel
    env:
      # 构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          # TUI 构建收敛共享脚本（airymax header 注入 + cargo + 部署，见
          # .github/scripts/build-tui.sh；macOS 为门禁产品腿，fail-hard）
          AIRY_TUI_FAIL_HARD=1 bash .github/scripts/build-tui.sh agent-workload/sdk/tui "${{ env.STAGE_DIR }}/bin"
          # Python 运行时依赖（完全体包 lib/，fail-closed）
          bash .github/scripts/copy-python-runtime.sh "${{ env.STAGE_DIR }}" \
            || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }

      # macOS dylib 自包含（同 arm-64 腿）
      - name: Bundle macOS runtime dylibs (self-contained)
        run: bash _tools/scripts/ci/release/bundle-macos-dylibs.sh "${{ env.STAGE_DIR }}"

      # 干净机"可启"冒烟（同 arm-64 腿）
      - name: Smoke-run packaged daemons (clean-machine proxy)
        run: bash _tools/scripts/ci/release/smoke-macos-runtime.sh "${{ env.STAGE_DIR }}"

      # 打包：lf-package 统一模板（macOS 原生腿无 bootstrap 部署）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-64
          artifact-suffix: macos-x86-64
          with-bootstrap: 'false'

  # Windows x64：原生 runner（无 container）。vcpkg 已预装于
  # windows-latest（$env:VCPKG_INSTALLATION_ROOT）。zip 包必须与 tar.gz 包
  # 保持完全体一致（config 模板 + permission_rules + maths-toolkit +
  # platform 标记），防止 Windows 包缺失组件。
  build-windows-x86-64:
    # Windows 为完整产品腿：tag/dispatch 均入发布矩阵，zip 经 release 聚合
    # 进入 publish REQUIRED_BIN/SUBTREE 预检（任一 daemon/CLI/TUI/python
    # 缺失即中止发布）。与 build-test windows-build 共享
    # ci-windows-runner-bus，防 MSVC 腿双 workflow 并跑占满 hosted 配额。
    concurrency:
      group: ci-windows-runner-bus
      cancel-in-progress: false
    runs-on: windows-latest
    # gate 语义：构建失败/zip 不完整即本腿失败（不静默缺件）。
    continue-on-error: false
    env:
      # 构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # vcpkg 二进制缓存恢复（key 随本 workflow 内容失效并回退前缀 key；
      # vcpkg classic 模式加性缓存天然正确）
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        # runner.temp 只能在 step 级 env 解析（job 级 env 无 runner context，
        # GitHub 判整个 workflow 无效）。
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: |
          # vcpkg 包名：curl（非 libcurl）、libmicrohttpd/libwebsockets（带 lib- 前缀）
          vcpkg install sqlite3 cjson curl openssl zlib libmicrohttpd libwebsockets libevent nghttp2 --triplet x64-windows
          # Rust 工具链（agentrt-tui 完全体包组件）
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
          & "$env:TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DENABLE_SANITIZERS=OFF `
            -DAIRY_BUILD_ALL=ON `
            -DBUILD_DAEMON=ON -DBUILD_CLI=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        shell: pwsh
        run: |
          # MSVC 编译失败时把错误以 ::error:: 上报为 annotation（日志下载需
          # admin，annotation 匿名 API 可读）。警告洪流会淹没真实错误且 GH
          # annotation 有长度限制：优先筛出 error C*/LNK*/fatal 行，无错误行
          # 时才回退到日志尾部。合并为单条多行消息。
          $buildLog = Join-Path $env:RUNNER_TEMP "build.log"
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            # C2220 的前一行即被升级的 warning（含真实告警码），一并纳入
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 60 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 60000) { $msg = $msg.Substring($msg.Length - 60000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Build TUI + copy Python runtime
        shell: pwsh
        env:
          # agentrt-rs/build.rs 依赖 airy_run_stream.h、tui/build.rs 依赖 VERSION：
          # Windows 布局下两者默认相对路径均找不到，显式注入 checkout 直布局路径。
          AGENTRT_RS_RUN_STREAM_H: ${{ github.workspace }}/commons/include/airy_run_stream.h
          AIRY_RT_VERSION_FILE: ${{ github.workspace }}/VERSION
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\tui-target"
          Push-Location "agent-workload/sdk/tui"
          & cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "[windows] TUI 构建失败（exit $LASTEXITCODE，bin/agentrt-tui.exe 发布完整性必需）" }
          Pop-Location
          if (Test-Path "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe") {
            Copy-Item "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe" "${{ env.STAGE_DIR }}\bin\" -Force
          } else { throw "[windows] TUI 产物缺失: $env:CARGO_TARGET_DIR\release\agentrt-tui.exe" }
          New-Item -ItemType Directory -Path "${{ env.STAGE_DIR }}\lib" -Force | Out-Null
          foreach ($p in @("agent-workload/ecosystem/agents/airymax_agents","agent-workload/ecosystem/agents/airymax_agents_rs","agent-workload/ecosystem/agents/orchestration","agent-workload/sdk/sdk-python/agentrt")) {
            if (-not (Test-Path $p)) { throw "[windows] python 运行时子树缺失: $p" }
            Copy-Item -Path $p -Destination "${{ env.STAGE_DIR }}\lib\" -Recurse -Force
          }

      # zip 包与 tar.gz 完全体一致（install.ps1 二进制模式依赖 config 模板）。
      - name: Package (zip)
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION }}"; $VERSION_NUM = $VERSION.TrimStart('v')
          $pkgDir = "pkg\agentrt-$VERSION_NUM"
          New-Item -ItemType Directory -Path "$pkgDir\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\modules" -Force | Out-Null
          Copy-Item -Path "${{ env.STAGE_DIR }}\*" -Destination "$pkgDir\" -Recurse -Force
          foreach ($cfg in @("agent-workload\ecosystem\manager\configs\agentrt.yaml","agent-workload\ecosystem\manager\model\model.yaml","_tools\scripts\ops\templates\secrets.env.example","_tools\scripts\ops\templates\permission_rules.yaml")) {
            if (Test-Path $cfg) { Copy-Item -Path $cfg -Destination "$pkgDir\config\" -Force }
          }
          if (Test-Path "agent-workload\ecosystem\markets\tools\maths-toolkit") {
            Copy-Item -Path "agent-workload\ecosystem\markets\tools\maths-toolkit" -Destination "$pkgDir\modules\" -Recurse -Force
          }
          if (Test-Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh") {
            Copy-Item -Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh" -Destination "$pkgDir\bin\" -Force
          }
          # 版本 SSoT 随包落地（与 tar.gz 腿同语义）：解包态无 install.env，
          # 启动器以包根 VERSION 自述版本。缺失即包无法自证版本。
          Copy-Item -Path "VERSION" -Destination "$pkgDir\VERSION" -Force
          New-Item -ItemType File -Path "$pkgDir\platform-x86-64" -Force | Out-Null
          $artifact = "agentrt-$VERSION-windows-x86-64"
          Compress-Archive -Path "pkg\*" -DestinationPath "$artifact.zip"
          # 校验和（Windows 无 sha256sum，用 Get-FileHash）
          (Get-FileHash -Algorithm SHA256 "$artifact.zip").Hash.ToLower() + "  $artifact.zip" | Out-File -FilePath "$artifact.zip.sha256"
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # Windows x86-32：x64 主机上 vcpkg x86-windows triplet + MSVC -A Win32
  # 构建。x64 宿主硬件兼容 i386，32 位用户态环境（受限旧机、WOW64 兼容面）
  # 仍可安装。
  build-windows-x86-32:
    # 与 x64 腿显式 needs 串行：同一 run 内两腿永不共时请求
    # ci-windows-runner-bus（同组并发会互顶取消）；跨 workflow 仍由本腿占组
    # 与 build-test windows-build 公平串行。
    needs: build-windows-x86-64
    concurrency:
      group: ci-windows-runner-bus
      cancel-in-progress: false
    runs-on: windows-latest
    continue-on-error: false
    env:
      # 构建目录位于源码树外；与 x64 腿异目录防 generator 互踩
      BUILD_DIR: ../build-x86
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # vcpkg 二进制缓存与 x64 腿分离（triplet 不同，产物不互通）
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache-x86
          key: vcpkg-cache-x86-${{ runner.os }}-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-cache-x86-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache-x86,readwrite"
        run: |
          # port 清单与 x64 腿一致（nghttp2：HTTP/2 在 Windows 禁用仍入清单
          # 保持两腿依赖面同构），仅 triplet 换 x86-windows
          vcpkg install sqlite3 cjson curl openssl zlib libmicrohttpd libwebsockets libevent nghttp2 --triplet x86-windows
          # Rust 工具链（宿主 x64）+ i686-pc-windows-msvc target（TUI 32 位产物）
          # i586（tier 2）在 hotfix 发行常缺 std 二进制；i686 为 tier 1 随
          # 每个发行必发，部署面无差
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
          & "$env:TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          rustup target add i686-pc-windows-msvc

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} -A Win32 `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DENABLE_SANITIZERS=OFF `
            -DAIRY_BUILD_ALL=ON `
            -DBUILD_DAEMON=ON -DBUILD_CLI=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        shell: pwsh
        run: |
          # 错误数据集语义与 x64 腿一致（::error:: annotation 匿名可读）
          $buildLog = Join-Path $env:RUNNER_TEMP "build-x86.log"
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 60 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC x86 build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 60000) { $msg = $msg.Substring($msg.Length - 60000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Build TUI (i686) + copy Python runtime
        shell: pwsh
        env:
          AGENTRT_RS_RUN_STREAM_H: ${{ github.workspace }}/commons/include/airy_run_stream.h
          AIRY_RT_VERSION_FILE: ${{ github.workspace }}/VERSION
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\tui-target-x86"
          Push-Location "agent-workload/sdk/tui"
          & cargo build --release --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "[windows-x86-32] TUI 构建失败（exit $LASTEXITCODE，bin/agentrt-tui.exe 发布完整性必需）" }
          Pop-Location
          $tuiExe = "$env:CARGO_TARGET_DIR\i686-pc-windows-msvc\release\agentrt-tui.exe"
          if (Test-Path $tuiExe) {
            Copy-Item $tuiExe "${{ env.STAGE_DIR }}\bin\" -Force
          } else { throw "[windows-x86-32] TUI 产物缺失: $tuiExe" }
          New-Item -ItemType Directory -Path "${{ env.STAGE_DIR }}\lib" -Force | Out-Null
          foreach ($p in @("agent-workload/ecosystem/agents/airymax_agents","agent-workload/ecosystem/agents/airymax_agents_rs","agent-workload/ecosystem/agents/orchestration","agent-workload/sdk/sdk-python/agentrt")) {
            if (-not (Test-Path $p)) { throw "[windows-x86-32] python 运行时子树缺失: $p" }
            Copy-Item -Path $p -Destination "${{ env.STAGE_DIR }}\lib\" -Recurse -Force
          }

      # zip 包与 x64 腿完全体一致；install.ps1 PROCESSOR_ARCHITECTURE=x86
      # 分支按此命名消费。
      - name: Package (zip)
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION }}"; $VERSION_NUM = $VERSION.TrimStart('v')
          $pkgDir = "pkg\agentrt-$VERSION_NUM"
          New-Item -ItemType Directory -Path "$pkgDir\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\modules" -Force | Out-Null
          Copy-Item -Path "${{ env.STAGE_DIR }}\*" -Destination "$pkgDir\" -Recurse -Force
          foreach ($cfg in @("agent-workload\ecosystem\manager\configs\agentrt.yaml","agent-workload\ecosystem\manager\model\model.yaml","_tools\scripts\ops\templates\secrets.env.example","_tools\scripts\ops\templates\permission_rules.yaml")) {
            if (Test-Path $cfg) { Copy-Item -Path $cfg -Destination "$pkgDir\config\" -Force }
          }
          if (Test-Path "agent-workload\ecosystem\markets\tools\maths-toolkit") {
            Copy-Item -Path "agent-workload\ecosystem\markets\tools\maths-toolkit" -Destination "$pkgDir\modules\" -Recurse -Force
          }
          if (Test-Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh") {
            Copy-Item -Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh" -Destination "$pkgDir\bin\" -Force
          }
          # 版本 SSoT 随包落地（与 tar.gz 腿同语义）：解包态无 install.env，
          # 启动器以包根 VERSION 自述版本。缺失即包无法自证版本。
          Copy-Item -Path "VERSION" -Destination "$pkgDir\VERSION" -Force
          New-Item -ItemType File -Path "$pkgDir\platform-x86-32" -Force | Out-Null
          $artifact = "agentrt-$VERSION-windows-x86-32"
          Compress-Archive -Path "pkg\*" -DestinationPath "$artifact.zip"
          (Get-FileHash -Algorithm SHA256 "$artifact.zip").Hash.ToLower() + "  $artifact.zip" | Out-File -FilePath "$artifact.zip.sha256"
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # RISC-V (linux-riscv64)：标准 runner 无 riscv64 第三方库（libcurl 等），
  # 经 Docker buildx + qemu 多架构容器构建（ubuntu:20.04 riscv64 镜像，
  # 与 x86-64/arm-64 统一 glibc 2.31 基线）。
  build-linux-riscv-64:
    # QEMU 全模拟在托管 runner 上持续撞 6h 单 job 硬上限：仅 dispatch 显式
    # 请求时尝试；完整制品由本地构建台 build.sh 交叉补发。仍尝试产出
    # riscv-64 制品但不阻断发布。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in riscv64 container
        uses: ./.github/actions/lf-build-container
        with:
          # riscv64 无专用工具链镜像（已知例外：ubuntu:20.04 非 digest 钉版），
          # QEMU 全模拟。
          image: ubuntu:20.04
          platform: linux/riscv64
          leg: riscv64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq \
              build-essential make perl curl python3 python3-pip \
              libsqlite3-dev libcurl4-openssl-dev \
              libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev \
              libwebsockets-dev libevent-dev libnghttp2-dev
            # cmake/cJSON/OpenSSL/libcurl/libwebsockets 自编译收敛到
            # lib-builddeps.sh（幂等 + 离线 deps 缓存优先，统一 libssl.so.3 链路）。
            bash /src/_tools/scripts/ci/release/lib-builddeps.sh
            # Rust 工具链仅供 agentrt-tui 构建。riscv64 为 canary 载体，TUI
            # 降级可接受；qemu 模拟下 rustup-init 偶发失败，重试 3 次后仍失败
            # 则告警降级，不阻塞其余平台门禁。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败，agentrt-tui 将缺失（riscv64 canary 降级继续）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui），失败降级不阻断。riscv64 链接器选择：
            # GNU ld 2.34 无法合并 RISC-V attributes（libc build script 即
            # 失败）——rust-lld 复制为 ld.lld，gcc driver 保留库路径，
            # -fuse-ld=lld 仅换链接器。
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            # agentrt-rs/build.rs 需 airy_run_stream.h（显式注入直布局路径）
            export AGENTRT_RS_RUN_STREAM_H="$PWD/commons/include/airy_run_stream.h"
            RUST_LLD="$(find "$HOME/.rustup" -name rust-lld -path '*riscv64*' 2>/dev/null | head -1)"
            if [ -n "$RUST_LLD" ]; then cp -f "$RUST_LLD" /usr/local/bin/ld.lld; chmod +x /usr/local/bin/ld.lld; fi
            if ! (cd agent-workload/sdk/tui && RUSTFLAGS="-C link-arg=-fuse-ld=lld" cargo build --release); then
              echo "warn: riscv64 TUI 构建失败（降级）"
            else
              cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" 2>/dev/null || true
            fi
            # Python 运行时依赖（完全体包 lib/，fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：包内建 agentrt-<version> 顶层目录（install.sh 二进制模式按
      # agentrt-* 目录名匹配解压位置），platform 标记 + sha256 + upload
      # 由 lf-package 统一模板收敛（staging 由 cmake --install 创建，必存在，
      # 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: riscv-64
          artifact-suffix: linux-riscv-64

  # ARM-64 (linux-arm-64)：原生 arm64 hosted runner（ubuntu-24.04-arm）
  # 执行，容器内 ubuntu:20.04 arm64 镜像零 QEMU 模拟，glibc 2.31 基线不变
  # （覆盖 arm-64 / arm-32 设备）。
  build-linux-arm-64:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 原生 arm64 runner：无需 Set up QEMU / buildx（x86_64 时代残留）。
      # docker run --platform linux/arm64 在 arm64 宿主上原生执行。

      - name: Build in arm-64 container
        uses: ./.github/actions/lf-build-container
        with:
          # 预构建工具链镜像（GHCR 公开，digest 钉版）：apt 依赖 +
          # lib-builddeps 自编译产物已固化进镜像，本腿只做项目构建/打包。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm64-20260906-1@sha256:598a269f97744d81d80c67ffd7516f7f79ad33b8bc904346a56a5c31d3dbc146
          platform: linux/arm64
          leg: arm-64
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage
          script: |
            export DEBIAN_FRONTEND=noninteractive
            # Rust 工具链仅供 agentrt-tui 构建（arm-64 门禁产品腿，TUI 属
            # REQUIRED_SUBTREE）；rustup 安装失败时下方 cargo 步骤将
            # fail-closed，不降级。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败（后续 cargo 步骤将 fail-closed）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui）：fail-closed——构建失败/缺件即腿失败
            export AGENTRT_RS_RUN_STREAM_H="$PWD/commons/include/airy_run_stream.h"
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            (cd agent-workload/sdk/tui && cargo build --release) \
              || { echo "::error::[arm-64] TUI 构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" \
              || { echo "::error::[arm-64] TUI 产物缺失"; exit 1; }
            # Python 运行时依赖（完全体包 lib/，fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-64
          artifact-suffix: linux-arm-64

  # 32 位 Linux（x86-32 / arm-32 双腿，均门禁）：覆盖老 x86 与 32 位 ARM
  # 用户空间——64 位内核 + 32 位用户态场景。统一 glibc 2.31 基线。
  # 两腿均为预构建工具链镜像（GHCR 公开，digest 钉版）+ 原生执行零 QEMU：
  # x86-32 在 x86_64 runner 经 CONFIG_IA32_EMULATION；arm-32 在 aarch64
  # runner 经 CONFIG_COMPAT。镜像构建本身即宿主 32 位兼容性 fail-fast。
  # 容器内架构判定禁用 uname（32 位/compat 容器返回内核架构），统一
  # dpkg --print-architecture fail-fast。
  # TUI 交叉构建移入 64 位钉版容器：宿主交叉两处硬伤——① rustc 不拆分
  # linker argv，LINKER="gcc -m32" 报 linker not found；② 宿主交叉产物绑
  # 宿主 glibc，破坏 2.31 基线（被容器内 finalize glibc 闸拦截）。64 位
  # 工具链镜像基线 ubuntu 20.04：容器内 gcc-multilib/cross-gcc 的 32 位
  # glibc 即 2.31，交叉产物天然对齐基线。arm-32 独立成腿（见下方
  # build-linux-arm-32）。
  build-linux-x86-32:
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      # 32 位用户态地址空间受限：自编译 deps（lib-builddeps.sh）与 cmake
      # 构建统一小并行（AIRY_JOBS），避免 -j$(nproc) 大并行 OOM/失败。
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # x86-32 TUI 在 amd64 钉版容器内交叉：i386 容器内 rustup 不可行；
      # 宿主交叉产物绑宿主 glibc，破坏 2.31 基线。amd64 工具链镜像基线
      # ubuntu 20.04（glibc 2.31）：容器内 gcc-multilib 的 32 位 glibc
      # 即 2.31，x86_64 rustup + i686 target 交叉产物天然对齐基线。
      # 链接：rustc 不拆分 linker argv，LINKER 用裸 gcc
      # + RUSTFLAGS -C link-arg=-m32（gcc 驱动位置无关接受 -m32）。
      # 失败降级不阻断（finalize 有 glibc 闸）。
      - name: Build TUI (i686 cross in amd64 container)
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:amd64-20260906-1@sha256:99d3ac35030b3a19ef36277b443e011005224ee53b6187e8a60ca40b429def82
          platform: linux/amd64
          leg: tui-i686-cross
          script: |
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-multilib
            curl --proto =https --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add i686-unknown-linux-gnu
            # 链接需 -m32（32 位 crt/start files，gcc-multilib 提供）
            export CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc
            export RUSTFLAGS="-C link-arg=-m32"
            # agentrt-rs/build.rs 需 airy_run_stream.h：显式注入直布局路径
            export AGENTRT_RS_RUN_STREAM_H=/src/commons/include/airy_run_stream.h
            export CARGO_TARGET_DIR=/tmp/tui-target
            # x86-32 门禁产品腿，TUI 属 REQUIRED_SUBTREE：fail-closed
            (cd /src/agent-workload/sdk/tui && cargo build --release --target i686-unknown-linux-gnu) \
              || { echo "::error::[x86-32] TUI 交叉构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            mkdir -p /src/stage/bin
            cp -f /tmp/tui-target/i686-unknown-linux-gnu/release/agentrt-tui /src/stage/bin/ \
              || { echo "::error::[x86-32] TUI 产物缺失"; exit 1; }

      - name: Build in x86-32 container
        uses: ./.github/actions/lf-build-container
        with:
          # 预构建 i386 工具链镜像（GHCR 公开，digest 钉版）。apt 依赖 +
          # lib-builddeps 自编译产物已固化进镜像（debian:bullseye
          # snapshot 源，glibc 2.31 基线不变；配方见
          # .github/docker/qemu-toolchain/debian-i386.Dockerfile）。
          # linux/386 容器在 x86_64 hosted runner 经内核
          # CONFIG_IA32_EMULATION 原生执行——零 QEMU，省去每轮
          # apt + 源码重编 deps。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:i386-20260906-1@sha256:1266ca270863b1a79a341acd65ca867a745f068ede80fa6f6c099ba8cbd3b76b
          platform: linux/386
          leg: x86-32
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS
          script: |
            # fail-fast：容器内架构必须为 i386。uname 在 32 位容器返回
            # 内核架构（x86_64），禁用；dpkg 视角才可信。
            [ "$(dpkg --print-architecture)" = "i386" ] || {
              echo "::error::[x86-32] container arch != i386: $(dpkg --print-architecture)"; exit 1; }
            # cmake/cJSON/OpenSSL/libcurl/libwebsockets 已
            # 由镜像构建期 lib-builddeps.sh 固化（/usr/local）。
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            # Python 运行时依赖（完全体包 lib/，fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: x86-32
          artifact-suffix: linux-x86-32

  # arm-32 (linux-arm-32) 门禁腿：原生 arm64 runner（ubuntu-24.04-arm）+
  # 预构建 armhf 工具链镜像（GHCR 公开，digest 钉版，apt+lib-builddeps
  # 已固化）。linux/arm/v7 在 aarch64 宿主上经内核 CONFIG_COMPAT 原生
  # 执行（零 QEMU）；glibc 2.31 基线不变。容器内架构判定禁用 uname
  # （compat 下返回 aarch64），镜像内 deps 目标已按编译器判定固化。
  # AIRY_JOBS=2 限并行，防 32 位链接期地址空间不足。
  build-linux-arm-32:
    runs-on: ubuntu-24.04-arm
    continue-on-error: false
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 原生 arm64 runner + AArch32 compat：无需 Set up QEMU。
      # docker run --platform linux/arm/v7 原生执行（无 binfmt 模拟）。

      # arm-32 TUI 在 arm64 钉版容器内交叉：arm/v7 容器内 rustup 不可行；
      # 宿主交叉产物绑 glibc 2.39，会被 bullseye 2.31 容器内 finalize
      # glibc 闸 fail-closed 拦截。arm64 工具链镜像基线 ubuntu 20.04
      # （glibc 2.31）：容器内 gcc-arm-linux-gnueabihf 的 cross glibc
      # 即 2.31，aarch64 rustup + armv7 target 交叉产物天然对齐基线
      # （cross linker 无空格，LINKER 直接可用）。
      # 失败降级不阻断（finalize 有 glibc 闸）。
      - name: Build TUI (armv7 cross in arm64 container)
        uses: ./.github/actions/lf-build-container
        with:
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm64-20260906-1@sha256:598a269f97744d81d80c67ffd7516f7f79ad33b8bc904346a56a5c31d3dbc146
          platform: linux/arm64
          leg: tui-arm32-cross
          script: |
            set -euo pipefail
            # 仅装 gcc-arm-linux-gnueabihf 不够：arm64 容器内 cross
            # sysroot（libc6-dev-armhf-cross 提供的
            # /usr/arm-linux-gnueabihf/include）缺席时，gcc 的 stdint.h
            # fallback 宿主头会令含 C 代码的 crate（如 ring）编译 fatal，
            # arm-32 包 TUI 静默缺失。显式补 cross C 库头。
            apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
            curl --proto =https --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add armv7-unknown-linux-gnueabihf
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
            # agentrt-rs/build.rs 需 airy_run_stream.h：显式注入绝对路径
            export AGENTRT_RS_RUN_STREAM_H=/src/commons/include/airy_run_stream.h
            export CARGO_TARGET_DIR=/tmp/tui-target-arm32
            # arm-32 门禁产品腿，TUI 属 REQUIRED_SUBTREE：fail-closed
            (cd /src/agent-workload/sdk/tui && cargo build --release --target armv7-unknown-linux-gnueabihf) \
              || { echo "::error::[arm-32] TUI 交叉构建失败（bin/agentrt-tui 发布完整性必需）"; exit 1; }
            mkdir -p /src/stage/bin
            cp -f /tmp/tui-target-arm32/armv7-unknown-linux-gnueabihf/release/agentrt-tui /src/stage/bin/ \
              || { echo "::error::[arm-32] TUI 产物缺失"; exit 1; }

      - name: Build in arm-32 container
        uses: ./.github/actions/lf-build-container
        with:
          # 预构建 armhf 工具链镜像（GHCR 公开，digest 钉版）。apt 依赖 +
          # lib-builddeps 自编译产物已固化进镜像，glibc 2.31 基线不变。
          image: ghcr.io/openairymax/agentrt-qemu-toolchain:arm32-20260906-1@sha256:2a661a6c33f69e00e2210e12ce185f82355218427fecfcf2ba2e75e8163d6477
          platform: linux/arm/v7
          leg: arm-32
          envs: -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS
          script: |
            # fail-fast：容器内架构必须为 armhf。uname 在 AArch32 compat
            # 下返回内核架构（aarch64），禁用；dpkg 才可信。
            [ "$(dpkg --print-architecture)" = "armhf" ] || {
              echo "::error::[arm-32] container arch != armhf: $(dpkg --print-architecture)"; exit 1; }
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            # Python 运行时依赖（完全体包 lib/，fail-closed）
            bash /src/.github/scripts/copy-python-runtime.sh "$STAGE_DIR" \
              || { echo "::error::python 运行时四子树拷贝失败（lib/ 完整性必需）"; exit 1; }
            # 完全体 finalize：容器内收集运行时 .so + fail-closed 校验（host
            # 无 /usr/local 自编译库，收集必 not found；.collected 不入包）
            bash /src/.github/scripts/finalize-linux-libs.sh "$STAGE_DIR" /src/_tools

      # 打包：lf-package 统一模板（staging 汇总 cp 硬失败防坏包）。
      - name: Package and upload (tar.gz)
        uses: ./.github/actions/lf-package
        with:
          version: ${{ env.VERSION }}
          platform-tag: arm-32
          artifact-suffix: linux-arm-32

  # 汇聚门禁平台制品 → 聚合为 release-dist 附件：既作为下方 publish job 的
  # 发布源，也作为审计/紧急 fallback 归档留存（release 附件 90 天）。
  # cosign+GPG+manifest+atomgit 上传统一由 _tools/scripts/ci/release/
  # publish-release.sh 执行。发布全链在下方 publish job 内执行，签名私钥存
  # release Environment secrets，需维护者人工 Approve 后才执行签名上传；
  # 上传超时由脚本 --max-time 3600 + 3 并发 + 上传完整性校验兜底，聚合
  # dist 附件兼作审计/紧急 fallback。
  release:
    # 发布门禁：同 commit 门禁全绿（ci-green）+ Linux x86-64 / x86-32 /
    # arm-64 / arm-32 + macOS arm-64 / x86-64 + Windows x86-64 / x86-32
    # 八平台全绿后才聚合。riscv 为 dispatch-only canary（不发制品，QEMU
    # 6h 上限预留 0.3.x）。
    needs: [ci-green, build-linux-x86-64, build-macos-arm-64, build-macos-x86-64, build-linux-arm-64, build-linux-x86-32, build-linux-arm-32, build-windows-x86-64, build-windows-x86-32]
    runs-on: ubuntu-latest
    # tag 推送或手动 dispatch（手动时版本来自 inputs.version）皆可触发。
    # success() 必须显式写出：带 needs 的作业一旦自定义 if，即替换掉默认的
    # success() 判据（官方语义：作业只按 if 条件决定是否运行，不再继承前置
    # 全部成功）。原式只有触发面判据，于是八平台任一红时本作业照跑，上方
    # 注释宣称的「八平台全绿后才聚合」在依赖图上并不成立，实际仅由下方
    # dist 内容预检兜底——图上门禁形同虚设，且「平台红而制品凑巧齐全」的
    # 路径无人拦截。本仓其余带 needs 的作业（e2e-clean-room、finalize-dist、
    # 三个 publish）均已写 success() && (...)，唯此作业缺判据。
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 子模块初始化：agent-workload 供安装器源（agentrt/scripts/install.
      # {sh,ps1}）与更新器源（sdk/tui/scripts/airymaxrt），tools 供发布
      # 脚本本体（publish-release.sh）。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # windows zip 随 release 聚合入 dist，publish REQUIRED_BIN/SUBTREE
      # 预检（zip 任一 daemon/CLI/TUI/python 缺失即中止发布）。zip 不参与
      # 下方 gen1~gen3 标记补全（tar.gz 专用；zip 无旧安装器兼容面）。
      - name: Assert windows zip present in release dist
        run: |
          ls -la dist/agentrt-*-windows-x86-64.zip* 2>/dev/null \
            || { echo "::error::windows x86-64 zip 未聚合入 dist"; exit 1; }
          ls -la dist/agentrt-*-windows-x86-32.zip* 2>/dev/null \
            || { echo "::error::windows x86-32 zip 未聚合入 dist"; exit 1; }
          echo "release dist 最终制品: $(ls dist/agentrt-*.tar.gz 2>/dev/null | wc -l) 个 tar.gz + $(ls dist/*.zip 2>/dev/null | wc -l) 个 zip"

      # 三代标记兼容：包内若只含 gen3 标记（如 platform-x86-64），旧代
      # 更新器以精确文件名匹配（platform-x64 等）会拒绝升级。此处单点
      # SSoT：为每个平台包补全 gen1~gen3 三代全量 platform-* 标记文件并
      # 重算 sha256，任何一代更新器/安装器均可匹配。口径与
      # sdk/tui/scripts/airymaxrt 及 agentrt/scripts/install.sh 的
      # plat_markers 同源（按架构词 x86-64/x86-32/arm-64/arm-32/...）。
      - name: Augment package arch markers (gen1~gen3)
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          markers_of() {
            case "$1" in
              x86-64)   echo "platform-x86-64 platform-x64 platform-x86_64 platform-amd64" ;;
              x86-32)   echo "platform-x86-32 platform-x86 platform-i686 platform-i386" ;;
              arm-64)   echo "platform-arm-64 platform-arm64 platform-aarch64" ;;
              arm-32)   echo "platform-arm-32 platform-arm32 platform-armv7l" ;;
              riscv-64) echo "platform-riscv-64 platform-riscv64" ;;
              riscv-32) echo "platform-riscv-32 platform-riscv32" ;;
              *) echo "" ;;
            esac
          }
          cd dist
          for t in agentrt-${VERSION}-*.tar.gz; do
            [ -e "$t" ] || continue
            plat="${t#agentrt-${VERSION}-}"; plat="${plat%.tar.gz}"
            arch="${plat#*-}"   # linux-x86-64 → x86-64（marker 只编码架构）
            ms="$(markers_of "$arch")"
            if [ -z "$ms" ]; then
              echo "::warning::跳过未知平台 ${plat} 的标记补全"
              continue
            fi
            tmpd="$(mktemp -d)"
            tar -xzf "$t" -C "$tmpd"
            # 各腿以 tar -C pkg . 打包 → 标记位于归档根
            for m in $ms; do [ -e "$tmpd/$m" ] || touch "$tmpd/$m"; done
            tar -czf "$t" -C "$tmpd" .
            rm -rf "$tmpd"
            sha256sum "$t" > "$t.sha256"
            echo "augment markers ${plat}: ${ms}"
          done
          echo "标记补全完成: $(ls agentrt-${VERSION}-*.tar.gz | wc -l) 个包"

      # 发布说明面向整个开源社区（公开场合）：三段式固定骨架
      # （概述/说明/其他），全文不超过 12 行；严禁出现内部工程流水
      # （commit 逐条罗列、CI 取证、内部路径等）。RELEASE_NOTES.d/
      # <VERSION>.md 是唯一 SSoT，随 tag 入库；缺失即 fail-closed。
      # 历史上此处另有「按 commit 合成」的兜底分支：它会把子模块 pin
      # 之类的维护提交写进正文（v0.1.19 事故），且同一事实存在两份
      # 生成逻辑，已删除。
      - name: Generate release notes
        run: |
          VERSION="${{ env.VERSION }}"
          IS_RC=0; case "$VERSION" in *-rc*) IS_RC=1 ;; esac
          NOTES_FILE="RELEASE_NOTES.d/${VERSION}.md"
          test -f "$NOTES_FILE" || {
            echo "::error::缺 ${NOTES_FILE}（发行正文 SSoT 必须随 tag 入库）"
            exit 1
          }
          cp -f "$NOTES_FILE" dist/notes.txt
          if [ "$IS_RC" = 1 ] && ! grep -q '候选版本' dist/notes.txt; then
            echo "候选版本（RC）：仅供测试与预览，生产部署请等待正式版。" >> dist/notes.txt
          fi
          test -s dist/notes.txt || { echo "::error::发布说明为空"; exit 1; }
          lines="$(wc -l < dist/notes.txt)"
          echo "发布说明已生成（社区面向，${lines} 行）"
          if [ "$lines" -gt 12 ]; then
            echo "::error::发布说明 ${lines} 行，超出 12 行上限"
            exit 1
          fi

      # 发布交接（发布已移出 runner）：校验 dist 后聚合上传为单一附件。
      # 本地发布命令（MCP/维护者）：
      #   download agentrt-<ver>-release-dist → sha256sum -c → 
      #   _tools/scripts/ci/release/publish-release.sh "<ver>" <dist_dir>
      - name: Aggregate dist for atomgit publish (hand-off)
        run: |
          ls -la dist/
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || {
            echo "::error::dist 无 tar.gz 制品，无法发布交接"; exit 1
          }
          test -n "$(ls dist/*.tar.gz.sha256 2>/dev/null)" || {
            echo "::error::dist 缺 sha256 校验件"; exit 1
          }
          # 安装器随附，便于本地发布直接使用（对齐 publish-release.sh 的
          # AIRY_INSTALLER_SRC 默认值）。fail-closed：安装器为发布交接
          # 必需件，缺失即中止（不再静默）
          cp -f scripts/install.sh dist/ || { echo "::error::缺 scripts/install.sh（安装器 SSoT）"; exit 1; }
          cp -f scripts/install.ps1 dist/ || { echo "::error::缺 scripts/install.ps1"; exit 1; }
          echo "发布交接包就绪: $(ls dist | wc -l) 个文件"

      - name: Upload release-dist (for audit / emergency fallback)
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # 容器洁净 e2e 门禁：在洁净 ubuntu:20.04 容器（与 build-linux-x86-64 腿
  # 工具链镜像同 glibc 2.31 基线）内，对聚合后的 release-dist 制品执行
  # install.sh --from-file 离线安装 → 启动 daemon 群 → airy_cli /daemons
  # 冒烟，一次 rc 全链出证（install→daemon→gateway→CLI）。容器内无任何
  # 开发工具链（脚本 fail-closed 断言），等价用户干净机。门禁：publish
  # needs 本 job，e2e 不过则不发布。
  e2e-clean-room:
    needs: [release]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # e2e 脚本本体在 tools 仓（_tools/scripts/ci/release/e2e-clean-room.sh）。
      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Download release-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist

      - name: Preflight
        run: |
          test -f dist/install.sh || {
            echo "::error::release-dist 缺 install.sh（安装器 SSoT）"; exit 1; }
          test -f "dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz" || {
            echo "::error::release-dist 缺 linux-x86-64 tarball，无法洁净 e2e"; exit 1; }
          test -f "dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz.sha256" || {
            echo "::error::release-dist 缺 linux-x86-64 sha256 校验件"; exit 1; }

      # 旧版升级路径 e2e：拉取当前 stable（prev）linux-x86-64 制品 + sha256
      #（取自 stable manifest 的 url/sha256，非文件名猜测），传 e2e 脚本
      # 第三参执行升级阶段（旧版离线安装 → update --file 新版 → config
      # 兼容断言 → rollback 回退断言）。prev 与本次发布同版本（稳定版同版
      # 重发）时跳过——无升级路径语义；latest 无 stable manifest（首次
      # 发布，该附件由 publish-atomgit 段首产）时按首版口径跳过——升级
      # 路径的前提"存在上一稳定版"不成立，与同版跳过同族；跳过须留
      # ::warning:: 痕迹，防 stable manifest 意外缺失后静默降级。
      - name: Fetch previous stable tarball (upgrade path)
        run: |
          set -euo pipefail
          mf="$(mktemp)"
          # B12（乙）：manifest 取自滚动 latest release 附件面（唯一事实源），
          # 非 contents API 第二事实源。
          if curl -fsSL "https://atomgit.com/openairymax/agentrt/releases/download/latest/manifest.stable.json" > "$mf"; then
            python3 - "$mf" /tmp/u9.env <<'PYEOF'
          import json, sys
          m = json.load(open(sys.argv[1]))
          pv = m['latest']
          art = m['releases'][pv]['artifacts'].get('linux-x86-64')
          assert art, 'prev stable manifest 无 linux-x86-64 artifact'
          with open(sys.argv[2], 'w') as f:
              f.write("PV=%s\nPVURL=%s\nPVSHA=%s\n" % (pv, art['url'], art['sha256']))
          PYEOF
            . /tmp/u9.env
            cur_norm="${VERSION#v}"; pv_norm="${PV#v}"
            if [ "$cur_norm" = "$pv_norm" ]; then
              echo "升级路径跳过：prev(${PV}) == 本次发布(${VERSION})"
              echo "PREV_TARBALL=" >> "$GITHUB_ENV"
            else
              fn="$(basename "$PVURL")"
              curl -fsSL -o "dist/$fn" "$PVURL"
              printf '%s  %s\n' "$PVSHA" "$fn" > "dist/$fn.sha256"
              (cd dist && sha256sum -c "$fn.sha256")
              echo "PREV_TARBALL=dist/$fn" >> "$GITHUB_ENV"
              echo "prev stable: $PV -> dist/$fn"
            fi
          else
            echo "::warning::latest 无 manifest.stable.json（首次发布，publish-atomgit 未曾产出）→ 无升级路径前提，跳过升级 e2e"
            echo "PREV_TARBALL=" >> "$GITHUB_ENV"
          fi

      # 镜像不用 digest 钉版：ubuntu:20.04 已 EOS（standard support 2025-05
      # 结束），官方 tag 冻结不再重推，浮动风险趋零；glibc 2.31 基线由 tag
      # 绑定。未来切基线（22.04/24.04）时须与构建腿工具链镜像同步切换并
      # 恢复 digest 钉版。
      - name: Clean-room e2e (install → daemons → CLI smoke + upgrade path)
        run: |
          docker pull ubuntu:20.04
          PREV_ARG=""
          FULL_ARG=""
          if [ -n "${PREV_TARBALL:-}" ]; then
            # 升级路径需要 airymaxrt-full：二进制安装的 bin/airymaxrt 为
            # thin 包装，管理命令经 full 委托（联网时从 agentrt 仓 latest
            # 附件面拉取）。clean 容器无 curl/python 不可联网——job 侧
            # （有网）预取同一对象（B12：release 附件面直取，非 contents
            # API base64 解码），经 /w 只读挂载传入 e2e 第四参，由 e2e
            # 自举 seed。
            curl -fsSL "https://atomgit.com/openairymax/agentrt/releases/download/latest/airymaxrt" \
              > dist/airymaxrt-full
            chmod +x dist/airymaxrt-full
            FULL_ARG="/w/dist/airymaxrt-full"
            PREV_ARG="/w/$PREV_TARBALL"
          fi
          docker run --rm -v "$PWD:/w:ro" ubuntu:20.04 \
            bash /w/_tools/scripts/ci/release/e2e-clean-room.sh \
              /w/dist/install.sh \
              "/w/dist/agentrt-${{ env.VERSION }}-linux-x86-64.tar.gz" \
              $PREV_ARG $FULL_ARG

  # ─── 发布拓扑：三段式拆分 ─────────────────────────────────────────────
  # 动机：旧单 job 串行 atomgit(SSoT 上传, 外网每连接 15-30KB/s, 大包
  # ~1.5h) → GH/Gitee 镜像，release run 墙钟被慢通道拉长到数小时，且任一
  # 环节失败都要整体重跑。三段式拆分，全部门禁维持"e2e 绿后才发布"：
  #
  #   1) finalize-dist：cosign 签名 + manifest + GPG asc 一次性"产物化"
  #      （publish-release.sh SKIP_UPLOAD=1，阶段 0-3 即退，零远端写入）。
  #      签名集成为三端共享的规范字节；manifest 幂等保护不再重生成、
  #      .asc 与正文恒一致——后续任何 job 都不再触碰签名内容。
  #   2) publish-mirror：从 finalize 的 publish-dist 直传 GitHub Releases
  #      （快通道，先于 atomgit 可见、数分钟内完成），随后 dispatch
  #      mirror-release.yml 在独立 run 后台幂等续跑 Gitee（不阻塞本 run）。
  #   3) publish-atomgit：SSoT 慢通道上传 + latest/ 指针切换（指针只在
  #      上传完成后才提交，install/update 永远指向已就绪制品）——与 GH
  #      快通道并行，互不阻塞；独立 concurrency 组支持单段重跑续传。
  #   4) publish-npm：B12（N-5）npm 薄壳通道，needs publish-atomgit。
  #      0.1.19 决策：npm registry 组织面尚未开通（外部账号前置），该通道
  #      降级为**非阻断观察面**——仍与附件刷新同 run 绑定、失败留红可见，
  #      但不再阻断整条 release；凭据就绪后须恢复 fail-closed（见台账 §349）。
  #
  # 发布顺序语义（社区面向文档化）：GH 数分钟先行可见 → atomgit SSoT
  # ~1.5h 并行补齐 → Gitee 后台幂等镜像。atomgit 仍是数据权威（SSoT），
  # GH/Gitee 只是镜像下载面，不改变主平台定位。
  # 密钥与令牌来自受保护 Environment 'release' secrets（需维护者一次
  # Approve；审批先于 finalize 签名与任何对外写入，仍是发布安全阀）。
  # 紧急 fallback：下载 publish-dist 附件后本地执行
  #   _tools/scripts/ci/release/publish-release.sh <ver> <dist_dir>
  # （私钥副本存维护者本地发布台）。
  finalize-dist:
    needs: [release]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      ATOMGIT_REPO: openairymax/agentrt
      # 发布预检/安装器快照同源（agentrt 即工作树根，scripts/ 在根下）
      AIRY_INSTALLER_SRC: ${{ github.workspace }}/scripts/install.sh
      AIRY_INSTALLER_PS1_SRC: ${{ github.workspace }}/scripts/install.ps1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Install gpg + cosign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnupg
          # cosign 钉版 v2.6.5（与发布台一致，SSoT）：latest（≥2.7）已强制
          # --new-bundle-format，废弃 --output-signature，会导致
          # "must specify --bundle" 发布失败。
          curl -fsSLo /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version | grep -i gitversion

      - name: Download release-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist

      - name: Finalize dist (cosign sign + manifest + GPG asc, no upload)
        run: |
          test -n "$(ls dist/agentrt-${{ env.VERSION }}-*.tar.gz 2>/dev/null)" || {
            echo "::error::release-dist 无 tar.gz 制品，中止 finalize"; exit 1
          }
          for f in dist/agentrt-${{ env.VERSION }}-*.tar.gz.sha256; do
            (cd dist && sha256sum -c "$(basename "$f")") || { echo "::error::sha256 复核失败: $f"; exit 1; }
          done
          # SKIP_UPLOAD=1：publish-release.sh 阶段 0.5~3（预检/cosign 签名/
          # manifest/GPG asc）后即退，把规范签名集写回 dist，供三端共享。
          # RELEASE_NOTES_FILE：manifest notes 与 GH/Gitee body 同源。
          SKIP_UPLOAD=1 RELEASE_NOTES_FILE="$PWD/dist/notes.txt" \
            bash _tools/scripts/ci/release/publish-release.sh "${{ env.VERSION }}" dist

      - name: Upload publish-dist (canonical signed set for all mirrors)
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-publish-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # 发布镜像（快通道）：同一 canonical publish-dist 直传 GitHub
  # Releases——保证 tag 与 Releases 二进制附件同步可见。附件字节与
  # atomgit 同源（不经慢通道回拉）；幂等（同名同大小
  # 跳过/元数据对齐）；tag 前置校验 fail-closed。GH 完成后 dispatch
  # mirror-release.yml 把 Gitee 段放到独立 run 后台幂等续跑（Gitee 外网
  # 限速慢，内联会拖长 release run；异步后本 run 墙钟 ≈ atomgit 段）。
  publish-mirror:
    needs: [finalize-dist, e2e-clean-room]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # GH 快通道（SKIP_GITEE=1）无长杆；60min 与 mirror-release.yml 同口径，
    # 封顶避免数据面停滞把 job 挂到默认上限。
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: write
    concurrency:
      # 独立单段并发组：仅 github 上下文（env 上下文在 job 级 concurrency
      # 求值期不可用，会导致"Invalid workflow file / 0 jobs"校验失败）。
      # ref_name 对 tag/手动触发均唯一。
      group: publish-mirror-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Download publish-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-publish-dist
          path: dist

      - name: Mirror release to GitHub (fast channel)
        run: |
          # SKIP_GITEE=1：本段只做 GH 快通道；Gitee 由下一步 dispatch 的
          # mirror-release.yml 在独立 run 幂等补齐（读同一 publish-dist）。
          SKIP_GITEE=1 \
            bash _tools/scripts/ci/release/publish-mirror.sh "${{ env.VERSION }}" dist

      - name: Dispatch Gitee mirror (async, non-blocking)
        if: success()
        run: |
          # 同一 canonical publish-dist（release_run_id 定位）交给
          # mirror-release.yml 在后台续跑 Gitee；GH 段幂等跳过。concurrency
          # group=mirror-release-${{ inputs.version }} 保证同版本不叠跑。
          # dispatch 失败只告警不阻塞（GH 快通道已完成，Gitee 可稍后手动
          # 触发 mirror-release.yml 补齐）。
          gh workflow run mirror-release.yml \
            --repo "${{ github.repository }}" --ref main \
            -f version="${{ env.VERSION }}" \
            -f fetch_missing=false \
            -f release_run_id="${{ github.run_id }}" \
            || { echo "::warning::Gitee mirror dispatch 失败（GH 快通道已完成，Gitee 稍后可手动补齐）"; exit 0; }
          echo "已 dispatch mirror-release.yml（version=${{ env.VERSION }}, run_id=${{ github.run_id }}）"

  # 慢通道：atomgit（SSoT）上传 + latest/ 指针切换。与 publish-mirror
  # 并行，互不阻塞；SKIP_SIGN=1 复用 finalize 的规范签名集（manifest 幂等
  # 保护不再重生成，.asc 恒一致）。独立 concurrency 组，单段失败可只重跑
  # 本 job 幂等续传（AIRY_FORCE_UPLOAD=1 先删后传）。latest/ 只在全部附件
  # 上传并校验通过后才提交（指针切换绑定 SSoT 补齐），失败自动 cancel
  # 恢复语义由重跑保持。
  publish-atomgit:
    needs: [finalize-dist, e2e-clean-room]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 单文件 PUT 上限 60min × UPLOAD_RETRY 4 = 4h 理论最坏；封顶 300min
    # 使"上传挂死"以失败态终止（fail-fast，进入可重跑的重试路径），而非
    # 静默耗尽默认 360min 上限。
    timeout-minutes: 300
    environment: release
    permissions:
      contents: write
    concurrency:
      # 见 publish-mirror 注：job 级 concurrency 仅可用 github 等上下文。
      group: publish-atomgit-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
      ATOMGIT_REPO: openairymax/agentrt
      # manifest commit 双端同步所需（publish-release.sh 阶段 5 向 GitHub
      # main 补推，fail-soft；无 PAT 时跳过并告警）。
      GITHUB_REPO: ${{ github.repository }}
      GITHUB_PAT: ${{ secrets.GH_TOKEN }}
      # 同 tag 重发/修复：OBS 预签名 PUT 按文件名覆盖，设置
      # AIRY_FORCE_UPLOAD=1 使发布永远覆盖远端同名附件，杜绝"跳过上传但
      # manifest 已按新 sha 重生成"的不一致。
      AIRY_FORCE_UPLOAD: '1'
      # runner 布局与本地伞仓不同（agentrt 即工作树根，scripts/ 在根下），
      # 显式指定安装器 SSoT；AIRY_LAUNCHER_SRC 默认已指向
      # agent-workload/sdk/tui/scripts/airymaxrt（init-submodules 补齐）。
      AIRY_INSTALLER_SRC: ${{ github.workspace }}/scripts/install.sh
      AIRY_INSTALLER_PS1_SRC: ${{ github.workspace }}/scripts/install.ps1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Download publish-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-publish-dist
          path: dist

      - name: Publish to atomgit (SSoT upload + latest/ pointer switch)
        run: |
          test -n "$(ls dist/agentrt-${{ env.VERSION }}-*.tar.gz 2>/dev/null)" || {
            echo "::error::publish-dist 无 tar.gz 制品，中止发布"; exit 1
          }
          # SKIP_SIGN=1：签名集已由 finalize-dist 固化于 publish-dist，
          # 本段只上传 + 更新 latest/，绝不再重签（避免跨端字节漂移）。
          # RELEASE_NOTES_FILE 与 finalize 同源（manifest 幂等不重生成）。
          SKIP_SIGN=1 RELEASE_NOTES_FILE="$PWD/dist/notes.txt" \
            bash _tools/scripts/ci/release/publish-release.sh "${{ env.VERSION }}" dist

  # B12（0.1.18，N-5）：npm 薄壳通道 publish。needs publish-atomgit——数据
  # 权威面（含阶段 4.6 的 download/latest/ 附件刷新）成功后才允许动 npm，
  # 防"附件新、npm 旧 / npm 新、附件旧"漂移。0.1.19 决策（台账 §349）：npm
  # registry 组织面未开通期间该 job 为非阻断观察面（continue-on-error），
  # 失败仍以红步 + 告警留痕；NPM_TOKEN 就绪后删除 continue-on-error 即恢复
  # fail-closed。dist-tag 按通道分层：stable 占 latest（恒新），rc/beta 挂
  # 各自通道标、不污染 latest。
  publish-npm:
    needs: [publish-atomgit]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    environment: release
    permissions:
      contents: read
    concurrency:
      group: publish-npm-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Preflight NPM_TOKEN
        id: pre
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 凭据缺失时显式跳过（告警留痕），避免把"外部账号未开通"伪装成
          # 代码失败；凭据存在但发布失败仍会红步，漂移可被看见。
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN 未配置，npm 薄壳通道本轮跳过（非阻断观察面）"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @openairymax/agentrt
        if: steps.pre.outputs.skip != '1'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          case "$ver" in
            *-rc*)   dist=rc ;;
            *-beta*) dist=beta ;;
            *)       dist=latest ;;
          esac
          # N-4 版本注入：包版本 = release tag（去 v 前缀，semver 合规）。
          npm --no-git-tag-version version "$ver"
          # 幂等续传：单段重跑时精确版本已在 registry → 跳过 publish 仅校验。
          if [ "$(npm view "@openairymax/agentrt@$ver" version 2>/dev/null || true)" = "$ver" ]; then
            echo "npm @openairymax/agentrt@${ver} 已存在，跳过 publish（续传语义）"
          else
            npm publish --tag "$dist"
          fi
          # fail-closed 回验：registry 必须可精确取到本轮版本。
          [ "$(npm view "@openairymax/agentrt@$ver" version 2>/dev/null || true)" = "$ver" ] || {
            echo "::error::npm 回验失败：registry 无 @openairymax/agentrt@${ver}"; exit 1; }
          # N-4 保鲜：stable 发布后 latest dist-tag 必须指向本轮版本。
          if [ "$dist" = "latest" ]; then
            [ "$(npm view @openairymax/agentrt dist-tags.latest 2>/dev/null || true)" = "$ver" ] || {
              echo "::error::dist-tag latest 未指向 ${ver}（npm 面保鲜断裂）"; exit 1; }
          fi


