name: Quality Gates

# 伞仓 tools/scripts 下的 quality-gate 全量门禁编排器接入本发布平面。
# 门禁脚本与 SSoT 数据位于伞仓（tools/docs/agent-workload），本作业
# 按来源直取到临时区、组装出 quality-gate.sh 期望的 PROJECT_ROOT
# 布局后运行，不递归 clone 伞仓子模块图。
#
# 门禁清单不在本文件复制：编排器与全部门禁（当前 46 门）的权威定义在
# tools/scripts/ci/quality/gates/quality-gate.sh。此处曾手抄一份 26 门的
# 编号—名称对照表，门禁增补只落在 tools 侧，副本随即失真——step 名写
# 「26 gates」而实际跑 46 门，判红时连「红在哪一门」都要回编排器反查。
# 双副本 = 漏改 = 视图与事实分叉（与本仓 SHA 单点同一纪律）。
#
# 双 job 结构：quality-gate 跑伞仓全量门禁编排器；release-gates 跑本仓
# WS-9 发布门禁编排器（scripts/verify_release_gates.sh，0.1.19 §3.4
# 「门禁脚本在而不生效」→ L1 接线 fail-closed，详见该 job 注释）。
#
# 纯文档变更跳过；同一 ref 的并发运行自动取消；构建树外化到 runner
# temp，不落源码区。

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (agentrt host, minimal)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 数据集完整性：agentrt 为 workflow 宿主仓，其 6 个叶子子模块
      # （atoms/commons/daemons/gateway/heapstore/protocols，SHA 由
      # agentrt 树 gitlink 钉定）是本作业的源码底料——门禁
      #   Gate 1 编译（airy_cli 依赖 atoms 的 airy_coreloopthree 目标）、
      #   Gate 2（扫 atoms/coreloopthree 契约）、
      #   Gate 5 跨仓校验（需 daemons/tool_d/src/service_builtin.c）、
      #   Gate 7 SSoT（TP-012~016 物理宿主在 daemons/atoms/gateway）、
      #   Gate 8 头文件重复度（子模块头文件）
      # 全部直接读取这些叶子目录。缺席即结构性必败。
      # atoms 为 GitHub 私有仓，由脚本经 GH_TOKEN（org PAT）写 ~/.netrc 认证。
      # 复用 build-test/codegen-check 同一脚本，保持检出语义单点。
      - name: Init submodules (agentrt leaves)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh

      # Gate 1（编译）所需的 C 工具链与依赖库；Gate 6（圈复杂度）需 lizard。
      # Gate 3（安全扫描）外部工具（trivy/gitleaks/cppcheck）缺失时按 skip 处理，
      # 不构成硬依赖，故此处不安装，避免拉长流水线。
      # Gate 46（生态四模块契约）在 runner 侧执行 ecosystem 四守卫，硬依赖
      #   PyYAML（prompts 注册表）、pytest（markets/skills）、aiohttp（skills）；
      # 三者一律显式安装——依赖缺失时 Gate 46 fail-closed 判红，不做 skip。
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libsqlite3-dev libcjson-dev libcurl4-openssl-dev \
            libssl-dev zlib1g-dev libzstd-dev \
            libmicrohttpd-dev libwebsockets-dev libevent-dev \
            python3 python3-pip python3-yaml python3-pytest python3-aiohttp
          python3 -m pip install --quiet 'lizard==1.23.0'

      # 组装门禁数据集，对齐 quality-gate.sh 的 PROJECT_ROOT 布局契约：
      #   tools   ← GitHub 镜像（门禁脚本与校验器宿主）
      #   docs    ← atomgit SSoT（Unify Design：SSoT 权威源，匿名可读）
      #   agentrt ← 本次工作区检出（即触发门禁的提交，最权威）
      #   ecosystem/sdk/products ← GitHub 镜像（Gate 5 跨仓校验的兄弟叶仓；
      #     ecosystem 需再递归其第二层子模块，见下）
      # 私有嵌套子模块（atoms 等）经 ~/.netrc 认证——该文件已由上方
      # init-submodules.sh 单点写入（检出语义单点），此处不再重复写。
      - name: Assemble gate dataset (tools, docs, agent-workload)
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -euo pipefail
          UMB="$RUNNER_TEMP/airymaxhub"
          mkdir -p "$UMB/agent-workload"
          git clone -q --depth 1 https://github.com/openairymax/tools.git "$UMB/tools"
          git clone -q --depth 1 https://atomgit.com/openairymax/docs.git "$UMB/docs" \
            || git clone -q --depth 1 https://github.com/openairymax/docs.git "$UMB/docs"
          # docs 的 docs-workload 子模块承载 SSoT 权威源注册表等判据
          # 文件；顶层浅克隆不展开子模块工作树，缺席即 Gate 7 结构性
          # 必红。子模块 URL 为 atomgit SCP 形式且 runner 无对应 SSH
          # key；url.insteadOf 对 submodule update 的克隆 URL 实测
          # 不生效（CI 复现 Host key verification failed），直接覆
          # 写 submodule.<name>.url 为 https 匿名拉取（公开仓，与
          # docs 主仓同通道）。
          git -C "$UMB/docs" config submodule.docs-workload.url \
            https://atomgit.com/openairymax/docs-workload.git
          git -C "$UMB/docs" submodule update --init --depth 1 -- docs-workload \
            || echo "::warning::docs docs-workload submodule unavailable, Gate 7 will fail"
          # docs-closed 承载受辖文档本体（如 0.1.20 方案）：Gate 45
          # DocConsistency 以「受辖文档缺席（fail-closed）」判红，其根因
          # 即此处未 init（run 40884260525 实证）。闭源属性与 docs-linux
          # 同（无公网镜像，匿名 https 被拒），走同一 oauth2 覆写模式；
          # token 缺失时退回匿名并显式告警。
          if [ -n "${ATOMGIT_TOKEN:-}" ]; then
            git -C "$UMB/docs" config submodule.docs-closed.url \
              "https://oauth2:${ATOMGIT_TOKEN}@atomgit.com/openairymax/docs-closed.git"
          else
            git -C "$UMB/docs" config submodule.docs-closed.url \
              https://atomgit.com/openairymax/docs-closed.git
          fi
          git -C "$UMB/docs" submodule update --init --depth 1 -- docs-closed \
            || echo "::warning::docs docs-closed submodule unavailable, Gate 45 will fail"
          # docs-workload 的 50-engineering-standards 是指向
          # ../docs-linux/50-engineering-standards 的 symlink（跨子
          # 模块依赖），docs-linux 不 init 则 symlink 悬空，Gate 7
          # 依旧找不到 09-ssot-registry.md。docs-linux 在 atomgit 为
          # 私有仓（匿名 https 被拒：could not read Username），带
          # ATOMGIT_TOKEN 走 oauth2 basic auth（同 sync-mirror.sh
          # src_url_authed 的已验证模式）；token 缺失时退回匿名并
          # 显式告警。Actions 对日志中 secret 自动掩码。
          if [ -n "${ATOMGIT_TOKEN:-}" ]; then
            git -C "$UMB/docs" config submodule.docs-linux.url \
              "https://oauth2:${ATOMGIT_TOKEN}@atomgit.com/openairymax/docs-linux.git"
          else
            git -C "$UMB/docs" config submodule.docs-linux.url \
              https://atomgit.com/openairymax/docs-linux.git
          fi
          git -C "$UMB/docs" submodule update --init --depth 1 -- docs-linux \
            || echo "::warning::docs docs-linux submodule unavailable, Gate 7 will fail"
          ln -s "$GITHUB_WORKSPACE" "$UMB/agent-workload/agentrt"
          for r in ecosystem sdk products; do
            git clone -q --depth 1 "https://github.com/openairymax/$r.git" \
              "$UMB/agent-workload/$r" \
              || echo "::warning::$r mirror unavailable, cross-repo check will skip it"
          done
          # sdk 的 tui 子模块承载启动器与 TUI 判据面：G38-4 的
          # launcher_profile_parse 直接读取 tui/scripts/airymaxrt。顶层
          # 浅克隆不含子模块工作树，缺席即该探针结构性红（run #369 实证）。
          # tui 为公开仓，相对 URL 经 https 匿名解析，与 sdk 主仓同通道。
          if [ -d "$UMB/agent-workload/sdk" ]; then
            git -C "$UMB/agent-workload/sdk" submodule update --init --depth 1 -- tui \
              || echo "::warning::sdk tui submodule unavailable, G38 launcher probe will fail"
            # sdk-python 承载 `agentrt` Python 包：Gate 46 的 skills 守卫在
            # 插件模块内 `from agentrt.plugin_types import ...`，其源码兜底
            # 路径正是 agent-workload/sdk/sdk-python。未 init 时该目录为空，
            # 兜底静默落空，Guard 以 ImportError 判红而红因指向插件源码
            # （run 41122590599 实证）。sdk-python 为私有仓，相对 URL 经
            # .netrc 的 GH_TOKEN 解析，与 ecosystem 第二层子模块同通道。
            git -C "$UMB/agent-workload/sdk" submodule update --init --depth 1 -- sdk-python \
              || echo "::warning::sdk sdk-python submodule unavailable, Gate 46 will fail"
          fi
          # ecosystem 的第二层子模块（agents/manager/…）承载门禁的直接数据源：
          #   Gate 5 工具 schema 双源之一 agents/airymax_agents/base.py，
          #   Gate 7 TP-012 物理宿主 manager/schema/plugin-manifest.schema.json。
          # 顶层浅克隆不含子模块工作树，必须显式初始化——缺席即两门结构性
          # 必红。子模块 URL 为相对路径（../<repo>.git），
          # 经 .netrc 的 GH_TOKEN 认证解析到 openairymax/<repo>。
          if [ -d "$UMB/agent-workload/ecosystem" ]; then
            git -C "$UMB/agent-workload/ecosystem" submodule update --init --recursive \
              || echo "::warning::ecosystem nested submodules unavailable, Gate 5/7 will fail"
          fi
          # §254a：cupolas 叶子挂点迁出至 products 装配仓，Gate M（R-6 PDP
          # 双 Schema）直接消费 products/cupolas/src/permission/。顶层浅克隆
          # 不含子模块工作树，须显式初始化；memoryrovol（update=none）自动豁免。
          if [ -d "$UMB/agent-workload/products" ]; then
            git -C "$UMB/agent-workload/products" submodule update --init --recursive \
              || echo "::warning::products nested submodules unavailable, Gate M will fail"
          fi

      - name: Run quality gates (46 gates)
        env:
          # 构建产物一律树外化（工程铁律 a）：落到 runner temp，不落源码区。
          QUALITY_GATE_BUILD_DIR: ${{ runner.temp }}/agentrt-quality-gate-build
        run: |
          # 全量输出先落盘再回显。Actions 完整日志匿名不可下载，annotation
          # 每 job 仅 ≤10 条且被截尾：46 门禁判红时，视图里只剩「某门 FAILED」
          # 而无判据，红因不可取证（Build & Test 腿的 ci-debug issue 已证明
          # 该通道是本仓唯一可匿名取证路径，此处按同口径接线）。
          set +e
          bash "$RUNNER_TEMP/airymaxhub/tools/scripts/ci/quality/gates/quality-gate.sh" \
            > /tmp/quality-gate.log 2>&1
          rc=$?
          # 判红门禁名与汇总行提为 annotation：它们在完整日志里散落各处，
          # 只靠 tail 窗口会被挤出视图，是取证的第一入口。
          # 回显统一剥 ANSI 颜色码：annotation 与视图都不渲染转义序列，
          # 残留码会把判据行糊成不可读噪声。
          if [ $rc -ne 0 ]; then
            grep -E '\[ERR\].*GATE:.*FAILED|GATE\(S\) FAILED|WARNING\(S\) TREATED' /tmp/quality-gate.log \
              | sed -E 's/\x1b\[[0-9;]*m//g; s/^/::error::  /' | head -20
            echo "::error::quality gates FAILED rc=$rc"
          fi
          grep -vE 'libselinux\.so\.1: no version information' /tmp/quality-gate.log \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tail -n 200
          exit $rc

      - name: Dump gate log to ci-debug issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -f /tmp/quality-gate.log ] && \
            bash .github/scripts/ci-debug-dump.sh "quality gates" "/tmp/quality-gate.log" || true

      # artifact 兜底：ci-debug issue 依赖 GH_TOKEN 与 issue 可写，
      # artifact 无需凭据即可从 run 页面取到完整 46 门禁日志。
      - name: Upload gate log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-logs
          path: /tmp/quality-gate.log
          if-no-files-found: ignore
          retention-days: 14

  # ==================== 本仓 WS-9 发布门禁（fail-closed 接线） ====================
  # scripts/verify_release_gates.sh（A~AH 组 137 断言）此前仅本地人工执行，
  # CI 零引用——门禁修复可静默回潮（§3.4 违例表首行「在而不生效」）。
  # 本作业使其常驻生效：脚本自身 FAIL>0 即 exit 1（末尾 fail-closed，
  # 无任何 || true 容错路径），step 非零退出即本 job 红。
  #
  # 跨仓判据（sdk tui 三副本 + U/V/W/Y 组 Rust 判据、tools
  # permission_rules.yaml 的 M3 组断言、products/gateway_biz 业务面
  # 判据）经 lf-gate-fixture 锁定 SHA 物化（SSoT 单点在 action，防镜像
  # HEAD 快照漂移——上游推进即一时绿一时红、本地复现不可得）；脚本对
  # 缺料仅限本地 skip，CI 侧兜底即该 action 的 test 兜底行。
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (agentrt host, minimal)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 结构性文件含 daemons/**（U 组判据 agent_d 源、AH 组四脚本）——
      # daemons 为叶子子模块（gitlink 钉定），缺席即结构性必败。与本
      # workflow 上方 job 同一检出脚本，保持检出语义单点。
      - name: Init submodules (agentrt leaves)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh

      - name: Fetch cross-repo gate fixtures (sdk + tools + products)
        uses: ./.github/actions/lf-gate-fixture
        with:
          gh_token: ${{ secrets.GH_TOKEN }}

      # python3-yaml 显式声明：门禁 AI1 组解析 CI YAML 硬依赖，此前
      # 依赖 runner 预装属环境侥幸（三腿统一显式契约）
      - name: Install gate deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-yaml

      - name: Run release gates (WS-9, A~AH)
        run: bash scripts/verify_release_gates.sh
