name: Codegen Checks

# 校验类流水线，触发器语义：
#   - codegen 漂移检查（syscall / daemons）：push/PR 常开（纯 python3，
#     无编译依赖，开销小）；
#   - ssot registry 校验：仅 workflow_dispatch 手动（较重——clone 伞仓
#     只读数据源 + 初始化嵌套子模块），不随 push/PR 自动跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syscall-codegen-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # agentrt 为 workflow 宿主仓：仅需初始化其 7 个叶子子模块（SHA 由
      # agentrt 树 gitlink 钉定）。atoms 为 GitHub 私有仓，init 脚本经
      # GH_TOKEN（org PAT）写入 ~/.netrc 认证，不改写 URL。
      - name: Init submodules (agentrt leaves)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh

      # syscall.xml（SSoT）与生成产物 syscall_ids.h / syscall_table_gen.h
      # 一致性校验。生成器仅依赖 python3 标准库，无需编译环境即可运行。
      # 任一生成产物与 SSoT 漂移即返回非零，阻止合入。
      - name: Verify syscall.xml SSoT drift (agentrt userland syscall)
        run: |
          python3 tools/codegen/syscall_gen.py \
            --input atoms/syscall/include/syscall.xml \
            --output-dir atoms/syscall/include \
            --check

  # daemons 五件套（L3 SSoT）漂移门禁：daemons/<name>/.manifest 为机制层
  # 装配唯一真值源，main.c / svc_<d>.h / sources.cmake 三件生成产物与它
  # 做一致性校验。生成器仅依赖 python3 标准库，从自身路径推导仓库根；
  # .manifest 位于 daemons 叶子子模块内，经 init-submodules.sh 就位。
  # 外户（0.1.19 §255，策略壳随产品离核，如 cupolas_d →
  # products/cupolas/daemon/）经 products 装配仓钉定的 cupolas gitlink
  # 解析 CUPOLAS_ROOT 入列——与 init-submodules.sh 发布布局同 SSoT
  # 语义（不硬编码分支，随 gitlink bump 自动跟随）。sync-mirror 为
  # atomgit→github 单向同步，镜像存在竞态窗口，clone 带退避重试。
  # 任一生成产物与 .manifest 漂移即返回非零，阻止合入。
  # 独立成 job 而非并入 syscall-codegen-check：job 名即 required check
  # 名，两套 SSoT 各自语义单一，互不牵连。
  daemon-codegen-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (agentrt leaves)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh

      - name: Clone cupolas shell via products gitlink (external daemon host)
        run: |
          # netrc 已由 init-submodules.sh 写入；镜像上 products/cupolas
          # 均为公开仓，匿名 clone 即可。.gitmodules 相对 URL
          # （../cupolas.git）在镜像下解析到 github org，checkout 落在
          # products 钉定的 cupolas SHA 上。
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/cupolas-host"
            if git clone -q --depth 1 \
              https://github.com/openairymax/products.git \
              "$RUNNER_TEMP/cupolas-host" &&
               git -C "$RUNNER_TEMP/cupolas-host" submodule update \
                 --init --depth 1 cupolas; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::cupolas shell unavailable (mirror sync race?)"
              exit 1
            fi
            sleep 20
          done

      - name: Verify daemon .manifest SSoT drift (daemons codegen)
        env:
          CUPOLAS_ROOT: ${{ runner.temp }}/cupolas-host/cupolas
        run: |
          python3 tools/codegen/daemon_gen.py --check

      # G14 组合代数 ⊗ 五性质用例（0.1.19 台账 L8713）：类型/地位/闭合/
      # 结合/幂等 + ⊙ 单位元，正反双向断言，末段以真实 .manifest 端到端
      # 复核。纯 python3 标准库，复用上一步已就位的 .manifest 与
      # CUPOLAS_ROOT 外户，无需额外克隆。
      - name: Verify composition algebra (G14 ⊗ five laws)
        env:
          CUPOLAS_ROOT: ${{ runner.temp }}/cupolas-host/cupolas
        run: |
          python3 tools/codegen/tests/test_algebra.py

  # 用户态 SSoT 技术点权威源门禁：registry 登记的 agentrt 技术点权威源
  # 与物理宿主路径必须全部存在，登记了不存在的路径即 CI 失败（漂移门禁）。
  # registry 与校验脚本位于伞仓数据（docs / tools / agent-workload），
  # 故本 job 克隆伞仓 GitHub 镜像到临时区并初始化子模块后运行校验。
  ssot-registry-validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (agentrt host, minimal)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 克隆伞仓 GitHub 镜像（registry=docs、脚本=tools、宿主=agent-workload），
      # 嵌套子模块经 GH_TOKEN 认证。
      - name: Clone umbrella dataset (docs, tools, agent-workload)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "${GH_TOKEN:-}" ]; then
            printf 'machine github.com\nlogin x-access-token\npassword %s\n' \
              "$GH_TOKEN" > "$HOME/.netrc"
            chmod 600 "$HOME/.netrc"
          fi
          git clone -q --depth 1 \
            https://github.com/openairymax/airymaxhub.git "$RUNNER_TEMP/airymaxhub"
          git -C "$RUNNER_TEMP/airymaxhub" submodule update --init --recursive -- \
            docs tools agent-workload

      - name: Run validate-ssot (umbrella SSoT registry)
        run: |
          python3 "$RUNNER_TEMP/airymaxhub/tools/scripts/ci/verify/validate-ssot.py" "$RUNNER_TEMP/airymaxhub"
