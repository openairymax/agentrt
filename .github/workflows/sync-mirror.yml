name: Mirror Sync
on:
  push:
    branches: [main]
    # tag 也要触发同步——agentrt 侧 tag（SSoT）需及时到达 GitHub，
    # release.yml（v*）才得以自动触发全链发布。
    tags: ['v*']
  # atomgit 侧 webhook（推送事件）→ GitHub repository_dispatch
  # 作为主/备 tag 同步通道（UI 配置；GH 侧 PAT 推送可再触发本工作流）。
  repository_dispatch:
    types: [sync-mirror]
  workflow_dispatch:

# GH_TOKEN：GitHub PAT（openairymax org 建仓/推送权限）——PAT 推送的
# tag 可触发 release.yml（GITHUB_TOKEN 推送不会）。
# GT_TOKEN：Gitee 访问令牌（org 建仓 + 推送）。
# ATOMGIT_TOKEN（可选）：atomgit 访问令牌，用于读取私有子仓（atoms）
# 的 mirror clone；缺省匿名克隆仅覆盖公开子仓。

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 不检出子模块：子模块镜像仓由本工作流创建/更新，检出即循环
      # 依赖；子模块数据源为 atomgit，见 .github/scripts/sync-mirror.sh。
      # persist-credentials:false：本步之后所有网络操作走 URL 内嵌
      # PAT / 匿名 HTTPS，不需要保留凭据。
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Sync agentrt + leaf submodules to mirrors
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GT_TOKEN: ${{ secrets.GT_TOKEN }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        # gh CLI 自动读取 GH_TOKEN 环境变量认证，无需 gh auth login
        # （login 在令牌无效时会直接中断整个 step，掩盖真实错误）。
        # agentrt 为 workflow 宿主仓：本工作流把 agentrt + 6 个叶子子模块
        # （atoms/commons/daemons/gateway/heapstore/protocols）及 sibling 数据仓
        # （含 §254a 迁出的 products/cupolas）从 atomgit(SSoT) 同步到
        # GitHub / Gitee 镜像。
        run: bash .github/scripts/sync-mirror.sh
