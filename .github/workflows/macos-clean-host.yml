name: macOS Clean-Host Verify

# macOS 干净真机核验载体：在 GitHub 托管 macOS runner（一次性干净 VM）上
# 复刻 e2e-clean-room 语义——install.sh --from-file 离线安装发布制品 →
# 完整启动器拉起 daemon 群 → gateway TCP 探测 → airy_cli /daemons 冒烟
# （online N==M 断言）。正式发布前以此对 macOS 干净真机出证。
#
# 制品口径：安装器与完整启动器取本 workflow 所在提交树（agentrt main 的
# scripts/install.sh + latest/airymaxrt，即正式发布随包的同一对象）；
# daemon/TUI/CLI 产品二进制取指定版本 release 的 macos 平台 tar.gz
# （product 内容与正式发布一致）。
#
# 触发：
#   - workflow_dispatch（版本由输入指定；手工复核用）；
#   - workflow_run（Release 成功完成后自动核验该 tag，版本取 tag 名）。
#     tag 仅在真正创建发行版时打（atomgit SSoT 单向同步）；
#   - repository_dispatch（types=macos-clean-host，payload 带 version）：
#     仅需 contents 写权限即可触发，用于发布 run 判红后补证——此时
#     workflow_run 不成立，而经典 PAT 的 workflow_dispatch 需要 workflow
#     scope（fine-grained 令牌一律 403），故以 dispatch 事件留出程序化通道。
# 两腿（arm-64 / x86-64）结构完全同构，matrix 收敛；各自验证对应架构
# 发布包。判定全在脚本内 fail-closed：job 结论 success 即出证。
#
# 注意（镜像拓扑）：产品 tar.gz 从 atomgit(SSoT) release 拉取；
# GitHub-hosted runner 可达 atomgit。断言输出打在步骤日志；
# job/step 结论经匿名 jobs API 可读，即证据链。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '待核验产品版本（如 vX.Y.Z；留空则取本树 VERSION，零硬编码）'
        required: false
  # 发行段完成后自动核验：不需要 actions:write，也不依赖人工 dispatch。
  # Release 是三段式唯一顶层 run（package/publish 为 reusable workflow，
  # 不产生独立 run），故监听 Release 完成即可保证制品已发布。
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # 程序化补证通道：与 workflow_dispatch 的 version 入参同义，由下方
  # env 表达式归一（inputs.version 为空时取 client_payload.version）。
  repository_dispatch:
    types: [macos-clean-host]

permissions:
  contents: read

concurrency:
  group: macos-clean-host
  cancel-in-progress: false

jobs:
  clean-host:
    name: macOS ${{ matrix.arch }} clean-host
    # 自动触发只在发行成功时核验；手工 dispatch 一律执行。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm-64
            runner: macos-latest
            suffix: macos-arm-64
          - arch: x86-64
            runner: macos-15-intel
            suffix: macos-x86-64
    runs-on: ${{ matrix.runner }}
    # 超时护栏：裸机宿主构建+验证（无容器隔离），macOS runner 较慢，
    # 对齐 build-test 重腿上限，防挂死拖到 6h 默认值
    timeout-minutes: 120
    env:
      SUFFIX: ${{ matrix.suffix }}
    steps:
      - name: Checkout (workflow + verify script)
        uses: actions/checkout@v5
        with:
          # 自动核验时取发行 run 的确切提交，安装器与制品同源；dispatch 取当前树。
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: "Resolve product version (SSoT: VERSION file)"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${EVENT_NAME}" = "workflow_run" ] && printf '%s' "${RUN_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?$'; then
            VERSION="${RUN_TAG}"
          else
            VERSION="v$(tr -d '[:space:]' < VERSION)"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9]+)?$'; then
            echo "::error::版本格式非法：${VERSION}（期望 vX.Y.Z）" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "resolved product version: ${VERSION}"

      - name: Download product tarball (atomgit release)
        run: |
          set -euo pipefail
          BASE="https://atomgit.com/openairymax/agentrt/releases/download/${VERSION}"
          curl -fsSL --retry 3 -o "agentrt-${VERSION}-${SUFFIX}.tar.gz" "$BASE/agentrt-${VERSION}-${SUFFIX}.tar.gz" \
            || { echo "::error::download failed: agentrt-${VERSION}-${SUFFIX}.tar.gz" >&2; exit 1; }
          curl -fsSL --retry 3 -o "agentrt-${VERSION}-${SUFFIX}.tar.gz.sha256" "$BASE/agentrt-${VERSION}-${SUFFIX}.tar.gz.sha256" \
            || { echo "::error::download failed: agentrt-${VERSION}-${SUFFIX}.tar.gz.sha256" >&2; exit 1; }
          ls -la agentrt-*

      - name: Run clean-host verify
        # 必须用 block scalar（|）：plain scalar 多行折叠会把行尾 \ 与折叠
        # 空格合并成转义空格，参数获得前导空格 → [ -f ] false。
        # AIRY_INSTALLER_BOOTSTRAPPED=1：钉死核验对象为本树 scripts/install.sh
        # （安装器自举对同内容仍会误切远程 main 重执行；核验语义要求测随版
        # 发布物，禁止运行时漂移）。
        env:
          AIRY_INSTALLER_BOOTSTRAPPED: '1'
        run: |
          bash .github/scripts/verify-macos-clean-host.sh \
            "$PWD/scripts/install.sh" \
            "$PWD/agentrt-${VERSION}-${SUFFIX}.tar.gz" \
            "$PWD/latest/airymaxrt"
