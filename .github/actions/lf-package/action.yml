name: 'lf-package'
description: |
  M3 方案 B（0.1.12）复合 action：tar.gz 打包统一模板——staging 拷贝 +
  config/modules 汇聚 + platform 标记 + sha256 + upload-artifact。
  收敛 7 处 tar.gz 打包腿（windows zip 腿不适用）。GITHUB_ENV 的
  artifact_name 对调用方 job 可见（composite action 与 job 同进程语义）。
inputs:
  version:
    description: >-
      发布版本号（含 v 前缀）。注意：manifest 加载期 env 上下文不可用，
      description 不得出现 env 表达式字面量（与 lf-init-deps #106/#108
      同因）；调用方传 env.VERSION 的求值结果。
    required: true
  platform-tag:
    description: '平台标记后缀（x86-64 / arm-64 / riscv-64…；与安装器/更新器 plat_name() 同口径校验）'
    required: true
  artifact-suffix:
    description: '制品名后缀（linux-x86-64 / macos-arm-64…；命名规范 0.1.10 起：OS-架构族-位宽）'
    required: true
  staging:
    description: 'staging 目录（相对仓库根）'
    required: false
    default: 'stage'
  with-bootstrap:
    description: '是否部署 bin/agentrt-bootstrap.sh（Linux 腿 true；macOS 原生腿 false）'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Package (tar.gz)
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"; VERSION_NUM="${VERSION#v}"
        PKG_DIR="pkg/agentrt-${VERSION_NUM}"
        mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
        cp -rf "${{ inputs.staging }}"/. "${PKG_DIR}/"
        # config 模板 SSoT（0.1.13 完整性强化）：此前 `|| true` 容忍拷贝，
        # 任一模板缺失即静默漏件（发布预检只能事后拦截）。模板均在仓库内，
        # 缺失 = 上游/检出故障，直接 fail-closed，杜绝半成品包出腿。
        for _cfg in \
          agent-workload/ecosystem/manager/configs/agentrt.yaml \
          agent-workload/ecosystem/manager/model/model.yaml \
          _tools/scripts/ops/templates/secrets.env.example \
          _tools/scripts/ops/templates/permission_rules.yaml; do
          if [ -f "$_cfg" ]; then
            cp -f "$_cfg" "${PKG_DIR}/config/" || { echo "::error::config 模板拷贝失败: $_cfg"; exit 1; }
          else
            echo "::error::config 模板缺失（漏件）: $_cfg"; exit 1
          fi
        done
        cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
        if [ "${{ inputs.with-bootstrap }}" = "true" ]; then
          # install.sh 二进制模式依赖 bin/agentrt-bootstrap.sh（daemon 编排
          # 脚本，位于 tools 子仓，cmake --install 不会带入），host 侧显式部署
          cp -f _tools/scripts/ops/bin/agentrt-bootstrap.sh "${PKG_DIR}/bin/" 2>/dev/null || true
        fi
        # 自托管工具链（A7-5 llama.cpp）：发行说明承诺自托管推理链可用，但
        # 此前包内只有 agentrt-bootstrap.sh——airy-local 及其 lib/templates
        # 缺席，用户拿到发行件无法执行自托管安装（能力只在源码树可用）。
        # airy-local 以 ${AIRY_LOCAL_DIR}/../{lib,templates} 解析依赖，故整棵
        # ops/ 同构落 share/ops/（bin/lib/templates 同级），不改脚本内路径
        # 算术；share/ 由 install.sh 原样部署到版本目录。缺件即检出故障，
        # fail-closed 拒绝出半成品包。
        mkdir -p "${PKG_DIR}/share/ops/bin" "${PKG_DIR}/share/ops/lib" \
          "${PKG_DIR}/share/ops/templates"
        cp -f _tools/scripts/ops/bin/airy-local "${PKG_DIR}/share/ops/bin/airy-local" \
          || { echo "::error::自托管安装器 airy-local 缺失"; exit 1; }
        chmod 755 "${PKG_DIR}/share/ops/bin/airy-local"
        for _opl in common.sh fetch.sh error.sh log.sh platform.sh; do
          cp -f "_tools/scripts/ops/lib/${_opl}" "${PKG_DIR}/share/ops/lib/${_opl}" \
            || { echo "::error::自托管库缺失: ${_opl}"; exit 1; }
        done
        for _opt in llama-pin.list llama-models.list; do
          cp -f "_tools/scripts/ops/templates/${_opt}" "${PKG_DIR}/share/ops/templates/${_opt}" \
            || { echo "::error::自托管 pin 表缺失: ${_opt}"; exit 1; }
        done
        # 管理面 full 启动器随包内置（0.1.19 洁净环境 e2e 根因）：缺此文件时
        # 安装器生成的 thin 包装只能用 curl 下载 latest/airymaxrt；离线或
        # 无 curl 的环境（e2e-clean-room 按设计如此）status 门禁恒失败，
        # 安装被中止。full 启动器为纯 bash，离线完成 status/update 全部
        # 管理命令。sdk 由 init-submodules 检出，缺失即检出故障 → fail-closed。
        cp -f agent-workload/sdk/tui/scripts/airymaxrt "${PKG_DIR}/bin/airymaxrt-full" \
          || { echo "::error::full 启动器缺失（agent-workload/sdk 未检出）"; exit 1; }
        chmod +x "${PKG_DIR}/bin/airymaxrt-full"
        # 版本 SSoT 随包落地：解包即用态无 install.env，启动器以包根 VERSION
        # 自述版本；缺失即包无法自证版本 → fail-closed。与 tools 侧
        # lib-package.sh 同语义（离线整包构建路径），双实现不得分叉。
        cp -f ./VERSION "${PKG_DIR}/VERSION" \
          || { echo "::error::版本 SSoT（仓库根 VERSION）缺失，包不完整"; exit 1; }
        # 运行时 .so 收集/校验已在构建容器内由 finalize-linux-libs.sh 完成
        #（host 无容器 /usr/local 自编译库，ldd 收集必 not found）
        # 平台标记勿回退 uname 原始名（platform-x86_64 会触发更新器
        # "制品架构与主机不匹配"拒绝，v0.1.9 打包回归实证）。
        touch "${PKG_DIR}/platform-${{ inputs.platform-tag }}"
        ARTIFACT="agentrt-${VERSION}-${{ inputs.artifact-suffix }}"
        tar -czf "${ARTIFACT}.tar.gz" -C pkg .
        sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
        echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.artifact_name }}
        path: ${{ env.artifact_name }}.*
        if-no-files-found: error
