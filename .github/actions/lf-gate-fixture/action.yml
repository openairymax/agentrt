    # 发行包 agentrt-tui 与门禁验证快照均停在缺口修复前；TUI cargo test
    # 599→620 全绿，判据消费面（scripts/airymaxrt 启动器）两 pin 零差异。
    # 144a8f8：tui gitlink 前推至 06db91d（0.1.21 会话历史与任务入口落盘、
    # 启动器与发行副本对齐）。旧 pin 260e362 的 tui 无 toolcat.rs 与
    # session_store.rs，V0/B3 与 TD2 判据读不到结构面、构建腿缺件；
    # AF1 双面一致判据要求启动器 pin 同步前推，否则取旧快照即报分叉。
    # ea6a149：tui gitlink 前推至 9767d61（启动器承接自托管模型管理与
    # 安装面 vault 选用）。该前推改动 scripts/airymaxrt，latest 发布面已
    # 同步，pin 不随之前推即报「latest 与 sdk 启动器分叉」。
    # 8e82624：tui gitlink 回退至 0.1.21 crate 元数据。当前发行线仍是
    # 0.1.21，0.1.22 不存在；crate 字段此前被一并 bump，与 VERSION 脱节。
    # 退回后门禁验证的快照与 v0.1.21 重发装配同源。
    # 902e2d8：tui gitlink 前推至 1fe1b67（运行轮 goal 取用户原文、门禁帧
    # 结算、断点查询用例补挂事件管道）。旧 pin 的 tui 把增强提示当目标
    # 下发并把门禁收口误判为断流，发行包与门禁快照会停在缺陷面。
    # e8d6747：tui gitlink 前推至 e3b2d6f（单测专用构造按约定抑制
    # dead_code），旧 pin 下 tui 的 clippy -D warnings 判红。
    # a74786d：tui gitlink 前推至 84b0f4d（终态落定按本轮补齐会话号与正文，
    # 投影并入帧信封身份）。旧 pin 的 tui 只把 run_end 的 data 段当终态，
    # 而服务端把身份放在信封上，成功轮次被判「missing field session_id」并
    # 落失败卡片；发行包与门禁快照必须同源前推。
    # ff21273：tui gitlink 前推至 02f5b42（发行启动器采纳运行期端口事实，
    # 与 agentrt latest/airymaxrt 逐字节一致）。旧 pin 的 scripts/airymaxrt
    # 仍按缺省端口预写并忽视已在线栈，AF1 双面判据报分叉，发行件也会在
    # 运行中的 gateway 旁边另起一个。
    # 9540efc：tui gitlink 前推至 ce2bd83（前端空参数数组按 POSIX 惯用式
    # 展开）。macOS 系统 bash 3.2 在 set -u 下把空数组的 "${arr[@]}" 判为
    # unbound variable，启动器直死、gateway 随之退出；旧 pin 的发行包
    # bin/airymaxrt-full 仍带该缺陷，干净机核验恒报 gateway offline。
    # 621beab：tui gitlink 前推至 7fc3c67（记忆镜像按会话分段水合 +
    # 无 HOME 安装根自愈）。启动器 scripts/airymaxrt 与 latest 发布面
    # 逐字节一致；旧 pin 9540efc 的 tui 仍停在 ce2bd83，AF1 双面判据
    # 取到旧快照即报「latest 与 sdk 启动器分叉」。
    # f7a0301：tui gitlink 前推至 2317501（子任务委派呈现为动作行；暂停
    # 说明以 run_end.stop_reason 的原话为准）。旧 pin 621beab 的 tui 无
    # stop_reason 消费面，N7-3 判据读不到即报「用户侧仍表现为无原因停住」；
    # 同快照的启动器新增二进制账，latest 发布面已同步，两者与门禁取到的
    # 快照逐字节一致，AF1 双面判据不因本前推而变。
    default: 'f7a030104d9d0a6b4026f97d0775c6e9abca3065'
