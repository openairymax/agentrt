name: 'lf-gate-fixture'
description: |
  跨仓门禁判据取料复合 action（0.1.19 §3.4「门禁脚本在而不生效」接线配套）。

  锁定 SHA 物化三腿跨仓料：
    - sdk(tui)   → agent-workload/sdk/tui：verify_release_gates.sh 三副本
                   一致断言与 U/V/W/Y 组 Rust 结构判据。
    - tools      → _tools/scripts/ops/templates/permission_rules.yaml：
                   M3 组 MCP 暴露集 ⊆ external 授权集断言
                   （脚本 L663：本地无仓仅限 skip，CI 侧由本 action fail-closed 兜底）。
    - products   → agent-workload/products/{gateway_biz,cupolas,lang_gateway,
                   cognition}：0.1.19 刀H 起 gateway 业务面寄宿 gateway_biz，
                   release-gates 的 AI/AM/AF 组直接读取其源文件；四件同时是
                   agentrt 构建的装配输入（cupolas 缺席则 cupolas_d /
                   airy_security_dome 不装配，全部 daemon 二进制缺失）。

  取料腿可按调用方裁剪（inputs.legs）；构建腿只取 products 时与门禁腿共用
  同一 pin，保证「门禁验证的产品件」即「构建装配的产品件」。

  SHA 单点声明：两个消费 workflow（build-test / quality-gate:release-gates）
  经本 action 共用同一锁定快照。严禁在任何 workflow 内复制 SHA 字面量——
  双副本 = bump 漏改一处 = 两个 workflow 门禁结论分叉（SSoT 违例）。

  锁 SHA 而非跟随默认分支 HEAD 的论证（build-test 历史注释收编）：门禁
  断言的是判据文件的**具体内容**，上游 main 一推进判据内容即变，同一
  agentrt 树会在两次 run 间一时绿一时红，且本地复现不可得。锁 SHA 后
  上游变更须显式 bump 才生效，漂移由静默转为可见。

  bump 流程（缺任一环节 CI 取到的仍是旧快照或假红）：
    1. 核对新 commit 与旧 pin 在本门禁消费路径上零差异，否则同步更新
       verify_release_gates.sh 判据。
    2. J1（更新面收敛到 release 附件）消费面在 tui 子仓：先在 tui 落地
       收敛提交，再由 sdk 前推 tui gitlink，最后 bump sdk_sha。
    3. 取值经 `git ls-remote <repo> refs/heads/main` 核验即为该仓 main
       当前 HEAD。

  结构约束（同 lf-init-deps，build-test #103 实证）：调用方必须先执行
  actions/checkout，再调用本 action。
inputs:
  gh_token:
    description: >-
      GitHub token。composite action manifest 加载期对全部字符串字段做模板
      求值且无 secrets 上下文——run 中出现 secrets 表达式字面量会直接
      "Unrecognized named-value" 硬失败（build-test #106/#108 实证）。
      调用方以 with.gh_token 传入仓库 secret GH_TOKEN，action 内部经
      env 消费。
    required: true
  sdk_sha:
    description: 'sdk 仓锁定 commit（判据消费：tui/scripts/airymaxrt + tui/src 判据面）'
    required: false
    # 8a61e36：tui gitlink 前推至 a80a492（0.1.19 TUI 收敛面：entry.rs、
    # present 拆件、Alt+E 键路）。旧 pin b688680 的 tui 尚未产出 entry/present，
    # Y 组判据读不到结构面、构建腿按新入口编译失败（run #557 实证）。
    # 63e9d67：tui gitlink 前推至 ba68318（解包即用态单根自锚定 + 版本查询）。
    # latest 发布面已同步该启动器，AF1 双面一致判据要求 pin 同步前推，否则
    # 取到旧快照即报「latest 与 sdk 启动器分叉」。
    default: '63e9d67fc8f0adddb694671e93812d4aa0ff44f5'
  tools_sha:
    description: 'tools 仓锁定 commit（判据消费：scripts/ops/templates/permission_rules.yaml + quality/gates 基线）'
    required: false
    # 5097aa1：函数名基线收敛（删去两个已重命名条目），使 NameLength 门禁
    # 不再每轮报「缩减 2 项」的常驻噪声。除基线外零差异。
    default: '5097aa1f5fbf3e629ce14fe6967a4b8e8bae4a52'
  products_sha:
    description: >-
      products 仓锁定 commit（判据消费与装配输入：gateway_biz 业务面源文件、
      cupolas 策略单元（子模块）、lang_gateway 语言网关、cognition 认知件）
    required: false
    # a56d530：cupolas 去掉 C11 原子量的花括号初始化（clang 拒绝，
    # macOS 构建腿因此编译失败，run #556 实证）；70bc6aa：cupolas 的
    # 服务计数器改用 atomic_compat 跨平台原子面，MSVC 不再直引
    # <stdatomic.h>（C1189，ci-debug #1356 实证）；dcf2a80：cognition
    # 线程安全测试改用 platform 跨平台线程面 airy_thread_create/join，
    # MSVC 不再裸引 pthread（LNK2001，ci-debug #1359 实证）。
    # 4e429bd：gateway_biz 协议宏收敛为 GW_PROTO_DETECT_LLM_API（与 agentrt
    # 枚举同名；旧 pin 的 GW_PROTO_DETECT_OPENAI 已不存在，Gate/Build 腿
    # 报未声明标识符）；cognition standalone 增补 memory provider 装配锚；
    # lang_gateway 分词族归属下沉产品侧。
    # 1a625b0：agentrt commons 在 dead-code 批次删除 error_utils.h，而本 pin
    # 的 cognition 仍 #include "error_utils.h"（intent_parser.c、
    # intent_parser_internal.h），三平台 Build 腿因此恒红——ci-debug #1827
    # （macOS：'error_utils.h' file not found）与 #1828（MSVC C1083）为直证，
    # Build & Test 自 run 476（2026-10-26）起连续判负。products 侧已由
    # Commit 072c35f92ba3 ("cognition: drop two stale error_utils includes")
    # 修掉，pin 未随伞仓 gitlink 前推才是缺口本身。新 pin 等于伞仓
    # agent-workload 记录的 gitlink，也等于 products 镜像 main tip。
    # 跨 52 个提交（GRAD 终态归因、canary 五态门禁、元认知闭环、
    # cupolas/memoryrovol gitlink 前推）。判据消费面无漂移：
    # verify_release_gates.sh 对该树 PASS=141 FAIL=0。
    # 030b724：macOS ctest 腿单子测试红的根因修正在此。cognition 的 C11
    # 契约 fake 跨调用持有 grad_llm_call 栈上配置指针并在返回后回读，
    # 属 use-after-scope；Linux 残骸恰好成全断言而绿，macOS 实测
    # temp=-5.5e37、seed=2451972（期望 GRAD_SEED=20260101）。旧 pin
    # 取不到该修正即恒红，缺口在 pin 未随镜像 main 前推，不在判据面。
    # 与旧 pin 单提交差，仅 cognition/tests/unit/test_grad_misc.c，
    # 不触判据消费路径，故 verify_release_gates.sh 无需同步改动。
    default: '030b724b9331d68b522d4b9ccd97cede1cb2677a'
  legs:
    description: >-
      取料腿选择（空格分隔：sdk tools products）。默认三腿全取；仅需产品件
      的构建腿可裁剪以省时（SHA 仍由本 action 单点持有，不得在 workflow
      内复制字面量）。
    required: false
    default: 'sdk tools products'
runs:
  using: composite
  steps:
    - name: Fetch cross-repo gate fixture (sdk tui)
      if: contains(inputs.legs, 'sdk')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # tui 在 sdk 内是 gitlink 子模块，sparse-checkout 不会落盘其内容，
        # 必须显式 submodule update 才检出 tui/scripts/airymaxrt；末行
        # test 兜底，取料失败即红（fail-closed，不得静默降级）。按 SHA
        # fetch 后 checkout，得到 detached 的锁定快照；submodule update
        # 随该 commit 记录的 gitlink 锁定 tui。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/sdk.git" \
          agent-workload/sdk
        git -C agent-workload/sdk fetch -q --depth 1 origin "${{ inputs.sdk_sha }}"
        git -C agent-workload/sdk checkout -q "${{ inputs.sdk_sha }}"
        git -C agent-workload/sdk submodule update --init --depth 1 -- tui
        test -f agent-workload/sdk/tui/scripts/airymaxrt

    - name: Fetch cross-repo gate fixture (tools permission_rules.yaml)
      if: contains(inputs.legs, 'tools')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # sparse 浅克隆仅取判据模板与构建装配件；末行 test 兜底，取料失败
        # 即红（fail-closed，不得静默降级）。落点 _tools/ 对齐
        # verify_release_gates.sh M3 组候选二与 init-submodules.sh 的
        # release 腿落点（agentrt 自带顶层 tools/ 为 codegen 等自有面，
        # 同名会互相遮蔽）。airy_depgraph 是 agentrt CMake 的跨仓装配输入
        # （AIRY_TOOLS_CANDS 第三候选 _tools），缺席则 P5 链接新鲜校验无
        # 工具可用（run #556 实证）。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/tools.git" \
          _tools
        git -C _tools fetch -q --depth 1 origin "${{ inputs.tools_sha }}"
        git -C _tools checkout -q "${{ inputs.tools_sha }}"
        git -C _tools sparse-checkout set scripts/ops/templates airy_depgraph
        test -f _tools/scripts/ops/templates/permission_rules.yaml
        test -f _tools/airy_depgraph/CMakeLists.txt

    - name: Fetch cross-repo gate fixture (products faces)
      if: contains(inputs.legs, 'products')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # sparse 浅克隆取四件装配输入与判据源；落点与 verify_release_gates.sh
        # 的候选二一致（$ROOT/agent-workload/products/<件>）。cone 模式的
        # sparse-checkout 把 gitlink 索引项当作文件而非目录，对 cupolas 直接
        # 判 "not a directory"（run #555 实证），故显式 --skip-checks；其后
        # 仍需 submodule update 才检出策略单元源。memoryrovol 声明
        # update=none，按路径限定不触发。末行四件 test 兜底，取料失败即红
        # （fail-closed，不得静默降级——缺席会使 cupolas_d 静默不装配）。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/products.git" \
          agent-workload/products
        git -C agent-workload/products fetch -q --depth 1 origin "${{ inputs.products_sha }}"
        git -C agent-workload/products checkout -q "${{ inputs.products_sha }}"
        git -C agent-workload/products sparse-checkout set --skip-checks \
          gateway_biz cupolas lang_gateway cognition
        git -C agent-workload/products submodule update --init --depth 1 -- cupolas
        for _face in gateway_biz cupolas lang_gateway cognition; do
          test -f "agent-workload/products/${_face}/CMakeLists.txt"
        done
