    # 1a625b0：agentrt commons 在 dead-code 批次删除 error_utils.h，而本 pin
    # 的 cognition 仍 #include "error_utils.h"（intent_parser.c、
    # intent_parser_internal.h），三平台 Build 腿因此恒红——ci-debug #1827
    # （macOS：'error_utils.h' file not found）与 #1828（MSVC C1083）为直证，
    # Build & Test 自 run 476（2026-10-26）起连续判负。products 侧已由
    # Commit 072c35f92ba3 ("cognition: drop two stale error_utils includes")
    # 修掉，pin 未随伞仓 gitlink 前推才是缺口本身。新 pin 等于伞仓
    # agent-workload 记录的 gitlink，也等于 products 镜像 main tip。
    # 跨 52 个提交（GRAD 终态归因、canary 五态门禁、元认知闭环、
    # cupolas/memoryrovol gitlink 前推）。判据消费面无漂移：
    # verify_release_gates.sh 对该树 PASS=141 FAIL=0。
    # 030b724：macOS ctest 腿单子测试红的根因修正在此。cognition 的 C11
    # 契约 fake 跨调用持有 grad_llm_call 栈上配置指针并在返回后回读，
    # 属 use-after-scope；Linux 残骸恰好成全断言而绿，macOS 实测
    # temp=-5.5e37、seed=2451972（期望 GRAD_SEED=20260101）。旧 pin
    # 取不到该修正即恒红，缺口在 pin 未随镜像 main 前推，不在判据面。
    # 与旧 pin 单提交差，仅 cognition/tests/unit/test_grad_misc.c，
    # 不触判据消费路径，故 verify_release_gates.sh 无需同步改动。
    # d1fd950：canary manifest 覆盖式改名原语 man_repl（Windows CRT
    # rename 拒绝已存在目标，run 40975362676 canary_unit 回滚判负
    # 实证）。与旧 pin 单提交差，仅 canary/src/canary_manifest.c，
    # 不触判据消费路径。
    # d494336：canary manifest 覆盖式改名改用 MoveFileExA
    # （MOVEFILE_REPLACE_EXISTING|WRITE_THROUGH）——d1fd950 的 remove+rename
    # 在两步之间留下两侧皆缺的崩溃窗口，而该文件是 C4 回滚锚点。与旧 pin
    # 单提交差，仅 canary/src/canary_manifest.c，不触判据消费路径。
    # 4b9e8e9：金丝雀 K1/K2 的度量源落到引擎双集评估（cupolas
    # dcb5bfa：灰度会话期同一请求在新旧两集各裁一次并上报观测）。
    # 与旧 pin 单提交差，仅 cupolas 的策略核/守护面/单测，不触
    # products/cupolas/src/permission/ 判据消费路径。
    # 652a778：cupolas 前进至 aa65885（金丝雀时延以时钟分辨率上报，替换
    # 秒级粗粒度差分；K1/K2 的观测值此前在亚秒区间恒为 0，等于度量源存在
    # 而不可读）。memoryrovol 指针同批同步，该件 update=none 不参与门禁。
    # 判据消费路径仍不触，仅装配输入前进。
    # a562df4：cupolas 前进至 14155ef（r141 映射装配哨兵槽回归：在容量边界
    # 8/9/15/16/17/32/33 与「16 条同名 capabilities」现场形态上钉住
    # yaml_size() 的 key==NULL 终点）。与旧 pin 单提交差，仅
    # cupolas/tests/unit/test_yaml_minimal.c，不触判据消费路径；不 bump 则
    # 该回归在 CI 中永不执行（pin 之外的测试树等于不存在）。
    # 6d29323：gateway_biz 的网关默认超时改由预算树 server 层给出（0.1.21
    # C-21：超时统一档位表，provider ≤ server ≤ client）。旧 pin a562df4 的
    # 业务面仍写死字面量，L1 判「预算树取料链断裂」，本地绿而 CI 红。
    # d1ce79f：cupolas/cognition 三处测试去掉 msvc 不支持的 unsetenv 与
    # 未导出的 _A_SUBDIR，Windows 腿的测试目标才可链接。
    # 0ba0a77：cupolas 审计夹具改用 win32 目录枚举（find 接口），Windows 腿
    # 的夹具发现不再依赖 POSIX dirent。判据消费路径不触，仅装配输入前进；
    # 不 bump 则该修正不进发行快照，Windows 审计用例仍按旧枚举取空集。
    # d523345：cupolas 溢出用例改按内容测大小、NULL 统计从零值起步。旧 pin 下
    # Windows 腿读目录索引大小得 0、读未初始化栈判非零，audit_overflow_tests
    # 两处假红；缺口在 pin 未前推，不在判据面。
    # 5fe4920：0.1.21 补丁批的产品面。cupolas gitlink 前推到 351166d
    # （R13：生产模式未配置口令时拒绝开库），本 action 物化的 cupolas 源
    # 因而与 tools 账 `cupolas=17656` 同源。不 bump 则发行装配缺 R13，
    # 且 g42 按旧树实测 17604 判「与 pin 差 52 行」。
    # 70ab3f2：cupolas 与 memoryrovol 的 RUN_TEST 改为比较失败计数水位
    # （断言失败不再被宏吞掉后仍报通过）。判据消费面只涉测试宏，产品源
    # 零差异；不 bump 则 Gate 52 与打包取到旧宏，假绿灯面仍在。
    # 9fea1e8：gateway_biz 与 gateway_d 的裸名解析面改挂
    # GATEWAY_COMMON_INCLUDE_DIRS（gateway 分层后 aipc/ 与 hall/ 子目录
    # 里的头在业务面不可解析，Linux 与 macOS 同一错误）；同批 cupolas
    # gitlink 前进到 666305f（S30-P1-6 策略基线 YAML 单点导入 PDP 运行集）。
    # 旧 pin 的业务面仍只挂 src/gateway 根，Build & Test 必红；且基线用例
    # 不在旧测试树内，等于永不执行。
    # 22130a7：大厅读侧的包含写法改为裸名。上一条只换了挂载面，映射文件
    # 仍按 src/gateway 根拼 gateway/ 前缀，指向分层后已不存在的路径。
    # 630a051：大厅读侧的符号面收敛到 commons 原语。分层删除了本地
    # hall_event_flatten 与 gw_hall_read_file，业务面调用改指 hall_evt_flat_file
    # 与 airy_io_read_file；hall_evt_flat_file 的声明在 AIRY_HAS_CJSON 守卫内，
    # 业务面同口径声明该宏并补挂 commons/utils/io 包含面。旧 pin 下业务面仍按
    # 已不存在的符号编译，公有三腿同一错误。
    # 4be53f1：cupolas 前进至 f295ff0（策略基线用例的临时夹具分两级建目录，
    # 建目录与写文件失败均显式判负）。旧 pin 的 t_mkdir/t_write 返回 void 并
    # 忽略失败：干净 runner 上 AIRY_TMP_DIR 整体不存在，写入被静默吞掉，
    # 6 次 dpolicy_base_load 全红——Linux 两腿与 Windows 腿同为
    # 14 pass / 21 fail，macOS 因临时根已存在而通过，三腿差异只由夹具目录
    # 是否存在解释。判据消费路径不触，仅装配输入前进；不 bump 则该修正
    # 在 CI 中永不执行。
    default: '4be53f1cf0b80501cf044420cd67259ff0b4f509'
  legs:
    description: >-
      取料腿选择（空格分隔：sdk tools products）。默认三腿全取；仅需产品件
      的构建腿可裁剪以省时（SHA 仍由本 action 单点持有，不得在 workflow
      内复制字面量）。
    required: false
    default: 'sdk tools products'
runs:
  using: composite
  steps:
    - name: Fetch cross-repo gate fixture (sdk tui)
      if: contains(inputs.legs, 'sdk')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # tui 在 sdk 内是 gitlink 子模块，sparse-checkout 不会落盘其内容，
        # 必须显式 submodule update 才检出 tui/scripts/airymaxrt；末行
        # test 兜底，取料失败即红（fail-closed，不得静默降级）。按 SHA
        # fetch 后 checkout，得到 detached 的锁定快照；submodule update
        # 随该 commit 记录的 gitlink 锁定 tui。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/sdk.git" \
          agent-workload/sdk
        # 镜像作业在推送跑批启动之后才发布叶子仓：按 SHA 取料可能先撞上
        # upload-pack "not our ref"。有限重试等镜像追平，仍缺失由其后
        # checkout/test 兜底判红（fail-closed 语义不变）。
        for _try in 1 2 3 4 5; do
          git -C agent-workload/sdk fetch -q --depth 1 origin "${{ inputs.sdk_sha }}" && break
          sleep 20
        done
        git -C agent-workload/sdk checkout -q "${{ inputs.sdk_sha }}"
        git -C agent-workload/sdk submodule update --init --depth 1 -- tui
        test -f agent-workload/sdk/tui/scripts/airymaxrt

    - name: Fetch cross-repo gate fixture (tools permission_rules.yaml)
      if: contains(inputs.legs, 'tools')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # sparse 浅克隆仅取判据模板与构建装配件；末行 test 兜底，取料失败
        # 即红（fail-closed，不得静默降级）。落点 _tools/ 对齐
        # verify_release_gates.sh M3 组候选二与 init-submodules.sh 的
        # release 腿落点（agentrt 自带顶层 tools/ 为 codegen 等自有面，
        # 同名会互相遮蔽）。airy_depgraph 是 agentrt CMake 的跨仓装配输入
        # （AIRY_TOOLS_CANDS 第三候选 _tools），缺席则 P5 链接新鲜校验无
        # 工具可用（run #556 实证）。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/tools.git" \
          _tools
        for _try in 1 2 3 4 5; do
          git -C _tools fetch -q --depth 1 origin "${{ inputs.tools_sha }}" && break
          sleep 20
        done
        git -C _tools checkout -q "${{ inputs.tools_sha }}"
        git -C _tools sparse-checkout set scripts/ops/templates airy_depgraph
        test -f _tools/scripts/ops/templates/permission_rules.yaml
        test -f _tools/airy_depgraph/CMakeLists.txt

    - name: Fetch cross-repo gate fixture (products faces)
      if: contains(inputs.legs, 'products')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail
        # sparse 浅克隆取五件装配输入与判据源；落点与 verify_release_gates.sh
        # 的候选二一致（$ROOT/agent-workload/products/<件>）。cone 模式的
        # sparse-checkout 把 gitlink 索引项当作文件而非目录，对 cupolas 直接
        # 判 "not a directory"（run #555 实证），故显式 --skip-checks；其后
        # 仍需 submodule update 才检出策略单元源。memoryrovol 声明
        # update=none，按路径限定不触发。末行五件 test 兜底，取料失败即红
        # （fail-closed，不得静默降级——缺席会使 cupolas_d 静默不装配，
        # 使 canary 机制核只 warn "not mounted" 而从不进编译）。
        git clone -q --filter=blob:none --sparse \
          "https://x-access-token:${GH_TOKEN}@github.com/openairymax/products.git" \
          agent-workload/products
        for _try in 1 2 3 4 5; do
          git -C agent-workload/products fetch -q --depth 1 origin "${{ inputs.products_sha }}" && break
          sleep 20
        done
        git -C agent-workload/products checkout -q "${{ inputs.products_sha }}"
        git -C agent-workload/products sparse-checkout set --skip-checks \
          gateway_biz cupolas lang_gateway cognition canary
        git -C agent-workload/products submodule update --init --depth 1 -- cupolas
        for _face in gateway_biz cupolas lang_gateway cognition canary; do
          test -f "agent-workload/products/${_face}/CMakeLists.txt"
        done
