    # 之间零差异，AF1 双面一致判据不因本前推而变。
    # 260e362：tui gitlink 前推至 cb158b4（0.1.20 社区反馈「TUI 功能不全」
    # 七项缺口闭合：Config 面板可执行、会话落盘 /sessions /new /close /rename、
